name: Prepare native Rui checks
description: Pinned Zig and existing build caches on standard supported runners
inputs:
  targets:
    description: Selected existing build targets
    default: '[]'
  check-part:
    description: Full-check partition, keeping concurrent cache writers separate
    default: all
  cold:
    description: Use genuinely empty build, package and global compiler caches
    default: 'false'
  compiled:
    description: A verified same-run artifact supplies emitted executables and pinned package sources
    default: 'false'
runs:
  using: composite
  steps:
    - name: Select fixture dependencies
      id: requirements
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        python3 - <<'PY'
        import json, os, sys
        sys.path.insert(0, 'tests/ci')
        from select_tests import setup_requirements
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for name, required in setup_requirements(json.loads(os.environ['TARGETS'])).items():
                print(f'{name}={str(required).lower()}', file=output)
        PY
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      if: ${{ steps.requirements.outputs.go == 'true' }}
      with:
        go-version: '1.27.1'
        cache: false
    - name: Identify the actual native build tools
      id: tools
      shell: bash
      run: |
        set -euo pipefail
        identity="$RUNNER_TEMP/rui-native-tools.txt"
        {
          uname -sm
          cc --version
          make --version
          perl -v
          if [ "$(uname -s)" = Darwin ]; then
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-path
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-build-version
          else
            cat /etc/os-release
            ldd --version
            ld --version
          fi
        } > "$identity"
        cat "$identity"
        echo "identity=$(shasum -a 256 "$identity" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/rui-zig
        key: rui-compiler-${{ runner.os }}-${{ runner.arch }}-0.17.0
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: build-cache
      if: ${{ inputs.cold != 'true' && inputs.compiled != 'true' }}
      with:
        # build.zig marks every Zig test run side-effectful: no acceptance
        # manifests are written/read. Output-producing build steps stay cached.
        path: |
          ~/.cache/zig
          .zig-cache
          zig-pkg
        key: rui-build-v2-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ steps.tools.outputs.identity }}-${{ hashFiles('build.zig.zon', 'src/build_*', 'src/*.patch') }}-${{ hashFiles('build.zig', 'src/**', 'tests/integration/**') }}-${{ inputs.check-part }}
        restore-keys: |
          rui-build-v2-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ steps.tools.outputs.identity }}-${{ hashFiles('build.zig.zon', 'src/build_*', 'src/*.patch') }}-${{ hashFiles('build.zig', 'src/**', 'tests/integration/**') }}-
          rui-build-v2-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ steps.tools.outputs.identity }}-${{ hashFiles('build.zig.zon', 'src/build_*', 'src/*.patch') }}-
    - name: Install pinned compiler
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)
            archive=zig-x86_64-linux-0.17.0
            checksum=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            ;;
          Darwin/arm64)
            archive=zig-aarch64-macos-0.17.0
            checksum=b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
            ;;
          *) echo "Unsupported actual native architecture" >&2; exit 1 ;;
        esac
        if [ ! -x "$RUNNER_TEMP/rui-zig/zig" ]; then
          curl --fail --location --show-error --connect-timeout 10 --max-time 90 \
            --retry 1 --retry-delay 1 --retry-max-time 95 \
            "https://pkg.hexops.org/zig/$archive.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$checksum  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/rui-zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/rui-zig"
        fi
        test "$("$RUNNER_TEMP/rui-zig/zig" version)" = 0.17.0
        echo "$RUNNER_TEMP/rui-zig" >> "$GITHUB_PATH"
        echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
        mkdir -p .zig-cache/tmp "$HOME/.cache/zig/tmp"
    - name: Install the selected Python fixture dependencies
      if: ${{ steps.requirements.outputs.h2 == 'true' || contains(fromJSON(inputs.targets), 'check') || contains(fromJSON(inputs.targets), 'check-full') }}
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/rui-python"
        packages=()
        if [ '${{ steps.requirements.outputs.h2 }}' = true ]; then
          packages+=('h2==4.3.0')
        fi
        if [ '${{ contains(fromJSON(inputs.targets), 'check') || contains(fromJSON(inputs.targets), 'check-full') }}' = true ]; then
          packages+=('pyte==0.8.2' 'wcwidth==0.2.13')
        fi
        "$RUNNER_TEMP/rui-python/bin/pip" --disable-pip-version-check install --retries 1 "${packages[@]}"
        echo "$RUNNER_TEMP/rui-python/bin" >> "$GITHUB_PATH"
    - name: Select empty caches for scheduled acceptance
      if: ${{ inputs.cold == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        root=$(mktemp -d "$RUNNER_TEMP/rui-cold.XXXXXX")
        mkdir -p "$root/local/tmp" "$root/global/tmp" "$root/packages"
        echo "ZIG_LOCAL_CACHE_DIR=$root/local" >> "$GITHUB_ENV"
        echo "ZIG_GLOBAL_CACHE_DIR=$root/global" >> "$GITHUB_ENV"
        echo "ZIG_LOCAL_PKG_DIR=$root/packages" >> "$GITHUB_ENV"
    - name: Fetch the existing pinned dependency graph
      if: ${{ inputs.compiled != 'true' && (inputs.cold == 'true' || steps.build-cache.outputs.cache-hit != 'true') }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
        bash src/fetch_dependencies.sh
