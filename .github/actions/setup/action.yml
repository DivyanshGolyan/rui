name: Prepare native Rui checks
description: Pinned Zig and existing build caches on standard supported runners
inputs:
  targets:
    description: Selected existing build targets
    default: '[]'
  check-part:
    description: Full-check partition, keeping concurrent cache writers separate
    default: all
  cold:
    description: Use genuinely empty build, package and global compiler caches
    default: 'false'
  compiled:
    description: A verified same-run artifact supplies emitted executables and pinned package sources
    default: 'false'
  publish-caches:
    # Only main publishes. PR jobs compile about as fast from main's snapshots
    # as from their own, whose 0.1-0.7 GB saves per job overflowed the shared
    # quota and evicted main's.
    description: Save caches after the job; read-only cache workflows pass 'false' to restore only
    default: ${{ github.ref == 'refs/heads/main' }}
runs:
  using: composite
  steps:
    # Each part selects its own checks (select_tests.BUILD_MODULES): an edit
    # to this file selects the full build gate, an edit to a part only what it can break.
    - uses: ./.github/actions/setup/fixtures
      id: fixtures
      with:
        targets: ${{ inputs.targets }}
        check-part: ${{ inputs.check-part }}
    - uses: ./.github/actions/setup/caches
      id: caches
      with:
        check-part: ${{ inputs.check-part }}
        cold: ${{ inputs.cold }}
        compiled: ${{ inputs.compiled }}
        publish-caches: ${{ inputs.publish-caches }}
    - name: Install pinned compiler
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)
            archive=zig-x86_64-linux-0.17.1
            checksum=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
            ;;
          Linux/aarch64)
            archive=zig-aarch64-linux-0.17.1
            checksum=a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
            ;;
          Darwin/arm64)
            archive=zig-aarch64-macos-0.17.1
            checksum=75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d
            ;;
          *) echo "Unsupported actual native architecture" >&2; exit 1 ;;
        esac
        if [ ! -x "$RUNNER_TEMP/rui-zig/zig" ]; then
          # Mirrors serve identical archives and the pinned checksum is the
          # authority, so a stalled source falls through to the next one and
          # the slow origin is tried last, as in .agents/setup.
          verified=false
          for source in https://pkg.hexops.org/zig https://zigmirror.hryx.net/zig https://ziglang.org/download/0.17.1; do
            if curl --fail --location --show-error --connect-timeout 10 --max-time 90 \
                --retry 1 --retry-all-errors --retry-max-time 100 \
                "$source/$archive.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz" &&
              echo "$checksum  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -; then
              verified=true
              break
            fi
            echo "::warning::Zig download from $source failed; trying the next source."
          done
          "$verified" || { echo "No source supplied a verified $archive archive" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/rui-zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/rui-zig"
        fi
        test "$("$RUNNER_TEMP/rui-zig/zig" version)" = 0.17.1
        echo "$RUNNER_TEMP/rui-zig" >> "$GITHUB_PATH"
        echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >> "$GITHUB_ENV"
        mkdir -p .zig-cache/tmp "$HOME/.cache/zig/tmp"
    - name: Reuse restored compilation at new inodes
      if: ${{ inputs.cold != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cc -O2 -Wall -Wextra -Werror tests/ci/zig_cache_restat.c -o "$RUNNER_TEMP/zig-cache-restat"
        "$RUNNER_TEMP/zig-cache-restat" .zig-cache/h "$HOME/.cache/zig/h" -- \
          "$PWD" "$RUNNER_TEMP/rui-zig/lib" "$PWD/.zig-cache" "$HOME/.cache/zig"
    - name: Select empty caches for scheduled acceptance
      if: ${{ inputs.cold == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        root=$(mktemp -d "$RUNNER_TEMP/rui-cold.XXXXXX")
        mkdir -p "$root/local/tmp" "$root/global/tmp" "$root/packages"
        echo "ZIG_LOCAL_CACHE_DIR=$root/local" >> "$GITHUB_ENV"
        echo "ZIG_GLOBAL_CACHE_DIR=$root/global" >> "$GITHUB_ENV"
        echo "ZIG_LOCAL_PKG_DIR=$root/packages" >> "$GITHUB_ENV"
    - name: Fetch the existing pinned dependency graph
      if: ${{ inputs.compiled != 'true' && (inputs.cold == 'true' || steps.caches.outputs.build-hit != 'true') }}
      shell: bash
      env:
        # GitHub-hosted archives come through the API, which anonymous load shedding spares.
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
        bash src/fetch_dependencies.sh
    # Only steps that run the PTY screen observer build its libghostty-vt,
    # from the test-only package in screen-emulator; installs never fetch it.
    # It keeps its own zig-pkg: Zig refuses ghostty's path dependencies from
    # a package directory outside it.
    - name: Fetch the screen observer's pinned package graph
      if: ${{ steps.fixtures.outputs.screen == 'true' && inputs.compiled != 'true' && (inputs.cold == 'true' || steps.caches.outputs.build-hit != 'true') }}
      shell: bash
      run: |
        set -euo pipefail
        packages="$PWD/screen-emulator/zig-pkg"
        manifest=screen-emulator/build.zig.zon
        env -u ZIG_LOCAL_PKG_DIR bash src/fetch_dependencies.sh "$manifest" "$packages"
        ghostty=$(sed -n '/\.ghostty_vt = /,/},/s/.*\.hash = "\([^"]*\)".*/\1/p' "$manifest")
        test -n "$ghostty"
        env -u ZIG_LOCAL_PKG_DIR bash src/fetch_dependencies.sh "$packages/$ghostty/build.zig.zon" "$packages" uucode
        env -u ZIG_LOCAL_PKG_DIR bash src/fetch_dependencies.sh "$packages/$ghostty/build.zig.zon" "$packages" aro
        env -u ZIG_LOCAL_PKG_DIR bash src/fetch_dependencies.sh "$packages/$ghostty/pkg/translate-c/build.zig.zon" "$packages" translate_c
        # Zig 0.17.1's build maker crashes downloading these lazy packages.
        for dependency in wuffs highway; do
          env -u ZIG_LOCAL_PKG_DIR bash src/fetch_dependencies.sh \
            "$packages/$ghostty/pkg/$dependency/build.zig.zon" "$packages" "$dependency"
        done
