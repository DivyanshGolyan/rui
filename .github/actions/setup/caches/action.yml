name: Restore and save the build caches
description: Restore native caches at setup; invoke save-only after compilation, including failures
inputs:
  check-part:
    description: Full-check partition, keeping concurrent cache writers separate
    default: all
  cold:
    description: Use genuinely empty build, package and global compiler caches
    default: 'false'
  compiled:
    description: A verified same-run artifact supplies emitted executables and pinned package sources
    default: 'false'
  publish-caches:
    description: Allow the later save-only invocation to publish these restored keys
    default: 'false'
  save-only:
    description: Save the keys captured by setup; run with always() after compilation
    default: 'false'
  setup-outcome:
    description: Outcome of setup and any prerequisite fetch or artifact restore
    default: ''
  work-outcome:
    description: Outcome of the bounded compile or configure step
    default: ''
outputs:
  build-hit:
    description: Whether the build cache restored an exact key
    value: ${{ steps.build-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Identify the actual native build tools
      id: tools
      if: ${{ inputs.save-only != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        identity="$RUNNER_TEMP/rui-native-tools.txt"
        {
          uname -sm
          cc --version
          make --version
          perl -v
          if [ "$(uname -s)" = Darwin ]; then
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-path
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-build-version
          else
            cat /etc/os-release
            ldd --version
            ld --version
          fi
        } > "$identity"
        cat "$identity"
        echo "identity=$(shasum -a 256 "$identity" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        # The build runner is compiled for the host CPU, which varies between
        # runners of one image, so its cache is only reusable per CPU model.
        # x86 names the model; ARM Linux has no "model name" line, so the first implementer line stands in, and
        # a /proc/cpuinfo with neither falls back to the machine type rather than failing the step.
        if [ "$(uname -s)" = Darwin ]; then cpu=$(sysctl -n machdep.cpu.brand_string); else cpu=$(grep -m1 -E '^(model name|CPU implementer)' /proc/cpuinfo || uname -m); fi
        echo "cpu=$(printf '%s' "$cpu" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Name the build cache keys
      id: build-keys
      if: ${{ inputs.save-only != 'true' && inputs.cold != 'true' && inputs.compiled != 'true' }}
      shell: bash
      env:
        PREFIX: rui-build-v2-${{ runner.os }}-${{ runner.arch }}-0.17.1-${{ steps.tools.outputs.identity }}-
        DEPS: ${{ hashFiles('build.zig.zon', 'screen-emulator/build.zig.zon', 'src/build_*') }}
        SOURCES: ${{ hashFiles('build.zig', 'build/**', 'src/**', 'tests/integration/**') }}
        CHECK_PART: ${{ inputs.check-part }}
      # The '.' ends the part: part names use [a-z0-9-], so one part's prefix
      # (compiled.) never starts another part's key (compiled-unit.).
      # Restore order: this part at these dependencies, this part across a
      # repin, then cache maintenance's baseline at these dependencies, which
      # seeds parts main never saves (codegen). Baseline's seed is its own
      # first prefix, so it is left empty, and actions/cache drops empty keys.
      run: |
        seed="${PREFIX}baseline.$DEPS-"
        if [ "$CHECK_PART" = baseline ]; then seed=; fi
        {
          echo "key=$PREFIX$CHECK_PART.$DEPS-$SOURCES"
          echo "prefix-deps=$PREFIX$CHECK_PART.$DEPS-"
          echo "prefix-part=$PREFIX$CHECK_PART."
          echo "prefix-seed=$seed"
        } >> "$GITHUB_OUTPUT"
    - name: Name the build runner cache keys
      id: runner-keys
      if: ${{ inputs.save-only != 'true' && inputs.cold != 'true' && inputs.compiled == 'true' }}
      shell: bash
      env:
        CPU: rui-runner-v2-${{ runner.os }}-${{ runner.arch }}-0.17.1-${{ steps.tools.outputs.identity }}-${{ steps.tools.outputs.cpu }}-
        BUILD: ${{ hashFiles('build.zig', 'build/**', 'build.zig.zon') }}
      run: |
        {
          echo "key=$CPU$BUILD"
          echo "prefix-cpu=$CPU"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: compiler-cache
      if: ${{ inputs.save-only != 'true' }}
      with:
        path: ${{ runner.temp }}/rui-zig
        key: rui-compiler-${{ runner.os }}-${{ runner.arch }}-0.17.1
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: build-cache
      if: ${{ inputs.save-only != 'true' && inputs.cold != 'true' && inputs.compiled != 'true' }}
      with:
        path: |
          ~/.cache/zig
          .zig-cache
          zig-pkg
          screen-emulator/zig-pkg
        key: ${{ steps.build-keys.outputs.key }}
        restore-keys: |
          ${{ steps.build-keys.outputs.prefix-deps }}
          ${{ steps.build-keys.outputs.prefix-part }}
          ${{ steps.build-keys.outputs.prefix-seed }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: packages-cache
      if: ${{ inputs.save-only != 'true' && inputs.cold != 'true' && inputs.compiled != 'true' }}
      with:
        path: zig-pkg
        key: rui-packages-v1-${{ hashFiles('build.zig.zon') }}
        restore-keys: rui-packages-v1-
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: runner-cache
      if: ${{ inputs.save-only != 'true' && inputs.cold != 'true' && inputs.compiled == 'true' }}
      with:
        path: |
          ~/.cache/zig
          .zig-cache
          !.zig-cache/o/ci-compiled
        key: ${{ steps.runner-keys.outputs.key }}
        restore-keys: ${{ steps.runner-keys.outputs.prefix-cpu }}
    - name: Capture missing exact keys for the later save
      if: ${{ always() && inputs.save-only != 'true' }}
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish-caches }}
        COMPILER_KEY: ${{ steps.compiler-cache.outputs.cache-primary-key }}
        COMPILER_HIT: ${{ steps.compiler-cache.outputs.cache-hit }}
        BUILD_KEY: ${{ steps.build-cache.outputs.cache-primary-key }}
        BUILD_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        PACKAGES_KEY: ${{ steps.packages-cache.outputs.cache-primary-key }}
        PACKAGES_HIT: ${{ steps.packages-cache.outputs.cache-hit }}
        RUNNER_KEY: ${{ steps.runner-cache.outputs.cache-primary-key }}
        RUNNER_HIT: ${{ steps.runner-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        for cache in COMPILER BUILD PACKAGES RUNNER; do
          key_var=${cache}_KEY
          hit_var=${cache}_HIT
          key=${!key_var}
          if [ "$PUBLISH" != true ] || [ "${!hit_var}" = true ]; then key=; fi
          echo "RUI_CACHE_${cache}_KEY=$key" >> "$GITHUB_ENV"
        done
    - name: Select publication keys from completed work
      id: save-keys
      if: ${{ always() && inputs.save-only == 'true' }}
      shell: bash
      env:
        SETUP_OUTCOME: ${{ inputs.setup-outcome }}
        WORK_OUTCOME: ${{ inputs.work-outcome }}
        JOB_SUCCESS: ${{ job.status == 'success' }}
      run: node .github/actions/setup/caches/save-keys.cjs
    # A composite has no post hook. Call this same owner with save-only: true
    # under always() after the bounded compile step, before slow diagnostics.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: ${{ always() && inputs.save-only == 'true' && steps.save-keys.outputs.compiler-key != '' }}
      with:
        path: ${{ runner.temp }}/rui-zig
        key: ${{ steps.save-keys.outputs.compiler-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: ${{ always() && inputs.save-only == 'true' && steps.save-keys.outputs.build-key != '' }}
      with:
        path: |
          ~/.cache/zig
          .zig-cache
          zig-pkg
          screen-emulator/zig-pkg
        key: ${{ steps.save-keys.outputs.build-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: ${{ success() && inputs.save-only == 'true' && steps.save-keys.outputs.packages-key != '' }}
      with:
        path: zig-pkg
        key: ${{ steps.save-keys.outputs.packages-key }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: ${{ always() && inputs.save-only == 'true' && steps.save-keys.outputs.runner-key != '' }}
      with:
        path: |
          ~/.cache/zig
          .zig-cache
          !.zig-cache/o/ci-compiled
        key: ${{ steps.save-keys.outputs.runner-key }}
