name: Policy checks
description: Run after the job's infrastructure steps (pinned packages, Node, pinned workflow linter), which stay job steps so a failure there reads as infrastructure. The checks run concurrently from checks.sh, namely tests/ci self-checks, caller-error, flake-source and client-locality ratchets, the TypeScript client and workflow lint; no native builds
inputs:
  skips:
    description: JSON list of policy self-checks whose inputs are unchanged
    required: true
runs:
  using: composite
  steps:
    - name: Determine whether caller inventory needs its pinned-stdlib bootstrap
      id: caller-bootstrap
      shell: bash
      run: |
        needed=$(python3 -B tests/ci/caller_errors.py --bootstrap-needed)
        echo "needed=$needed" >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/setup
      if: ${{ steps.caller-bootstrap.outputs.needed == 'true' }}
      with:
        # Install only the existing pinned compiler: no build/package caches,
        # selected fixture dependencies or native compilation in policy.
        targets: '[]'
        compiled: 'true'
        cold: 'true'
        publish-caches: 'false'
    - name: Run the policy checks
      shell: bash
      env:
        SKIPS: ${{ inputs.skips }}
      run: bash .github/actions/policy/checks.sh
