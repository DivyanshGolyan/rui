name: Dependency lag
on:
  # Keeps the deps-behind issue current (#1893).
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: dependency-lag
jobs:
  check:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List pinned dependencies behind upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/dependency_lag.py
