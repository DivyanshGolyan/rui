name: Diagnose screen child crash
on:
  push:
    branches: [claude/project-thread-n0xurl-diag]
permissions:
  contents: read
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        slot: [prefetch-1, prefetch-2, control-1, control-2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          targets: '["test-logic", "test-native", "upgrade-integration"]'
          check-part: compiled
          publish-caches: 'false'
      - name: Enable core dumps and record the CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -cE 'avx512' || true
          uname -a
          sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p
          (sudo apt-get install -yq gdb >/dev/null 2>&1 || true) &
      - name: Probe the lazy package host
        continue-on-error: true
        run: |
          ulimit -c unlimited
          echo | openssl s_client -connect deps.files.ghostty.org:443 -servername deps.files.ghostty.org -tls1_3 2>&1 | grep -iE 'Negotiated|group|Protocol|Cipher|Server Temp Key' || true
          zig fetch https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz; echo "zig fetch exit $?"
          zig fetch https://release.files.ghostty.org/libghostty-vt/1.0.0/libghostty-vt-1.0.0.tar.gz; echo "zig fetch exit $?"
      - name: Prefetch the lazy packages with curl
        if: ${{ startsWith(matrix.slot, 'prefetch') }}
        run: |
          set -euo pipefail
          get() {
            mkdir -p "screen-emulator/zig-pkg/$2"
            curl -sSfL "$1" | tar -xz --strip-components=1 -C "screen-emulator/zig-pkg/$2"
          }
          get https://deps.files.ghostty.org/wuffs-7411f488fe2e2c205c3d3b3d28638b7356522930.tar.gz N-V-__8AAP5JWgCGP_AD0teWpa4krRvE9VPZzvviGdbmN4jI
          get https://deps.files.ghostty.org/highway-66486a10623fa0d72fe91260f96c892e41aceb06.tar.gz N-V-__8AAGmZhABbsPJLfbqrh6JTHsXhY6qCaLAQyx25e0XE
          ls screen-emulator/zig-pkg
      - name: Build as linux_build does, with cores
        id: build
        continue-on-error: true
        run: |
          ulimit -c unlimited
          zig build ci-build -Dpr-ci=true -j8 -Dci-targets=test-logic,test-native,upgrade-integration -Dci-part=rest --prefix "$RUNNER_TEMP/out" --summary failures
      - name: Inspect cores
        if: always()
        run: |
          ls -la /tmp/cores || true
          command -v gdb || sudo apt-get install -yq gdb >/dev/null 2>&1 || true
          for c in /tmp/cores/core.*; do
            [ -e "$c" ] || continue
            file "$c"
            exe=$(file "$c" | sed -n "s/.*execfn: '\([^']*\)'.*/\1/p")
            echo "exe=$exe"
            [ -n "$exe" ] && file "$exe"
            gdb -batch -ex 'info threads' -ex 'thread apply all bt 12' -ex 'info registers' -ex 'x/12i $pc-24' -ex 'info proc mappings' "$exe" "$c" 2>&1 | head -200
          done
          find .zig-cache "$HOME/.cache/zig" -name maker -type f -exec ls -la {} \; 2>/dev/null | head
