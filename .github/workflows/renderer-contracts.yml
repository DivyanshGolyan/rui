name: Renderer contracts (Linux)
on:
  push:
    branches: ['td3/**']
  pull_request:
    paths:
      - 'src/**'
      - 'build.zig*'
      - 'tests/ci/renderer_mutation*'
      - 'tests/integration/session_sequence_model.py'
      - 'tests/qualification/direct-pty/**'
      - '.github/workflows/renderer-contracts.yml'

# Additive contract checks only. Existing selected and frozen qualification
# workflows keep their cadence, targets and assertions.
cache-mode: read
permissions:
  contents: read

concurrency:
  group: renderer-contracts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutations:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          targets: '["test", "test-logic", "human-cli-integration"]'
          check-part: renderer-contracts
      - name: Test mutation evidence classification and isolation
        run: python3 tests/ci/renderer_mutation_test.py
      - name: Require behavioral kills in isolated source copies
        run: python3 tests/ci/renderer_mutation.py --output .amp/td3/mutations
      - name: Retain exact-source counterexamples, patches and command logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-mutations-${{ github.sha }}-${{ github.run_attempt }}
          path: .amp/td3/mutations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
