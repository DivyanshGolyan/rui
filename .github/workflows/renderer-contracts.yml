name: Renderer contracts
# Nonblocking on PRs: Selected checks and merging never require these. PRs run
# them only for renderer and frontend owners; every promotion requires them.
# Manual runs also execute the mutation campaign.
on:
  pull_request:
    paths:
      - 'src/AnswerRenderer.zig'
      - 'src/SessionFrontend.zig'
      - 'src/SessionSubmission.zig'
      - 'src/session_consent.zig'
      - 'src/session_departure.zig'
      - 'src/SessionScreen.zig'
      - 'src/SessionTerminal.zig'
      - 'src/session_view.zig'
      - 'src/session_history.zig'
      - 'src/session_reads.zig'
      - 'src/ClientTask.zig'
      - 'src/ConversationViewport.zig'
      - 'src/Terminal*'
      - 'src/session_sequence_model_test.zig'
      - 'src/overview_view.zig'
      - 'src/Overview.zig'
      - 'src/keymap.zig'
      - 'src/status_page.zig'
      - 'src/command_value.zig'
      - 'src/home_path.zig'
      - 'src/os/**'
      - 'build.zig'
      - 'tests/ci/renderer_mutation*'
      - 'tests/integration/session_sequence_model*'
      - 'tests/integration/input_equivalence.py'
      - 'tests/integration/terminal_input_replay.py'
      - 'tests/integration/terminal_restoration_integration.py'
      - 'tests/qualification/direct-pty/**'
      - '.github/workflows/renderer-contracts.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable promotion candidate
        required: true
        type: string
      batch-base:
        description: Last promoted commit; a failure bisects base..ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: renderer-contracts-${{ github.event_name }}-${{ github.ref }}${{ inputs.ref && '-promotion' || '' }}
  cancel-in-progress: true

jobs:
  contracts:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.batch-base && 300 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          targets: '["terminal-restoration-integration"]'
          check-part: renderer-contracts
      - name: Install tmux for the smoke rows
        run: command -v tmux || { sudo apt-get update -q && sudo apt-get install -yq tmux; }
      - name: Harness self-tests
        id: selftest
        run: zig build renderer-contracts-selftest -j2 --summary all
      - name: Direct-PTY key matrix and tmux smoke
        id: pty
        if: ${{ !cancelled() }}
        run: zig build direct-pty -j2 --summary all -- --output "$RUNNER_TEMP/contracts/pty" --jobs 2
      - name: Ghostty primary input vectors
        id: ghostty
        if: ${{ !cancelled() }}
        run: zig build direct-pty -j2 --summary all -- --output "$RUNNER_TEMP/contracts/ghostty" --jobs 2 --vectors "$PWD/tests/qualification/direct-pty/ghostty.json"
      - name: Driver and disposal controls
        id: controls
        if: ${{ !cancelled() }}
        run: zig build direct-pty-controls -j2 --summary all -- --output "$RUNNER_TEMP/contracts/controls"
      - name: Original-recovery input encodings
        id: recovery
        if: ${{ !cancelled() }}
        run: zig build input-equivalence -j2 --summary all -- --output "$RUNNER_TEMP/contracts/recovery"
      - name: Unattended input replay
        id: replay
        if: ${{ !cancelled() }}
        run: zig build terminal-restoration-integration -j2 --summary all -- input-replay
      - name: Sequence models through frontend transitions
        id: sequence
        if: ${{ !cancelled() }}
        run: |
          ulimit -Sn 256
          zig build sequence-model -j2 --summary all -- --output "$RUNNER_TEMP/contracts/sequence"
      - name: Bisect the promotion batch with the failed contracts
        # The self-tests run only after setup and tmux succeed; without them every
        # replay fails and the verdict would blame stable.
        if: ${{ failure() && inputs.batch-base && steps.selftest.outcome != 'skipped' }}
        timeout-minutes: 240
        env:
          BASE: ${{ inputs.batch-base }}
          HEAD_SHA: ${{ inputs.ref }}
          # Each failed step's command, replayed in order in every bisected tree.
          FAILED: >-
            ${{ steps.selftest.outcome == 'failure' && 'zig build renderer-contracts-selftest -j2;' || '' }}
            ${{ steps.pty.outcome == 'failure' && 'zig build direct-pty -j2 -- --output "$RUNNER_TEMP/bisect/pty" --jobs 2;' || '' }}
            ${{ steps.ghostty.outcome == 'failure' && 'zig build direct-pty -j2 -- --output "$RUNNER_TEMP/bisect/ghostty" --jobs 2 --vectors "$PWD/tests/qualification/direct-pty/ghostty.json";' || '' }}
            ${{ steps.controls.outcome == 'failure' && 'zig build direct-pty-controls -j2 -- --output "$RUNNER_TEMP/bisect/controls";' || '' }}
            ${{ steps.recovery.outcome == 'failure' && 'zig build input-equivalence -j2 -- --output "$RUNNER_TEMP/bisect/recovery";' || '' }}
            ${{ steps.replay.outcome == 'failure' && 'zig build terminal-restoration-integration -j2 -- input-replay;' || '' }}
            ${{ steps.sequence.outcome == 'failure' && 'ulimit -Sn 256; zig build sequence-model -j2 -- --output "$RUNNER_TEMP/bisect/sequence";' || '' }}
        run: |
          test -n "${FAILED// /}" || { echo 'No contract step failed; nothing to bisect'; exit 0; }
          python3 -B tests/ci/promotion.py --base "$BASE" --head "$HEAD_SHA" --logs "$RUNNER_TEMP/promotion-bisect" \
            -- bash -euc "rm -rf \"\$RUNNER_TEMP/bisect\"; $FAILED"
      - name: Retain the bisect's verdict and replay logs
        if: ${{ failure() && inputs.batch-base }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-bisect-renderer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-bisect
          retention-days: 14
          if-no-files-found: ignore
      - name: Retain contract results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-contracts-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contracts
          retention-days: 3
          if-no-files-found: ignore
  mutations:
    # A promotion's workflow_call carries its dispatch event but runs no mutations.
    if: ${{ !github.event.repository.private && github.event_name == 'workflow_dispatch' && !inputs.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [test, test-logic, sequence-model]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          targets: '["test", "test-logic", "terminal-restoration-integration"]'
          check-part: renderer-mutations
      - name: Require behavioral kills in isolated source copies
        env:
          TARGET: ${{ matrix.target }}
        run: python3 -B tests/ci/renderer_mutation.py --target "$TARGET" --output "$RUNNER_TEMP/mutations"
      - name: Retain counterexamples, patches and command logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-mutations-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutations
          retention-days: 3
          if-no-files-found: ignore
