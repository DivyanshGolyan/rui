name: Renderer contracts
# Promotion-only: every promotion requires these; pull requests never run them.
# Manual runs also execute the mutation campaign.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable promotion candidate
        required: true
        type: string
      batch-base:
        description: Last promoted commit; a failure bisects base..ref
        required: true
        type: string
      release-version:
        description: Version of this run's release archives (Promote's Release build) to test; empty compiles rui
        required: false
        type: string
        default: ''

permissions:
  contents: read
  # Reads this run's release archives when a promotion supplies them.
  actions: read

concurrency:
  # The caller's name keeps Promote's tiers on one SHA from cancelling each other.
  group: renderer-contracts-${{ github.event_name }}-${{ github.ref }}${{ inputs.ref && format('-promotion-{0}', github.workflow) || '' }}
  cancel-in-progress: true

# Cache timeout accounting, not a setup deadline:
# setup-allowance-minutes: 25
# save-reserve-minutes: 3
# Selected 43832831879: setup 213 s; allow four further (200 s retry + 90 s request) windows.
# Leave setup uncapped: cold fetch outliers still have the original job budget.

jobs:
  contracts:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.batch-base && 300 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          targets: '["terminal-restoration-integration"]'
          check-part: renderer-contracts
      - name: Fetch the release executable this promotion publishes
        id: release
        if: ${{ inputs.release-version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release-version }}
          SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # A standalone assignment, so a failed fetch fails this step instead of leaving rui empty.
          rui=$(python3 -B tests/ci/release_under_test.py "$VERSION" "$SHA" "$RUNNER_TEMP/release-under-test")
          echo "rui=$rui" >> "$GITHUB_OUTPUT"
      - name: Self-tests, direct-PTY, Ghostty, controls and recovery encodings
        id: compile
        # Cache timing: green 725 s, run 43732653500; minimum margin 120 s.
        # Limit = job budget - cold setup allowance - save reserve.
        timeout-minutes: ${{ inputs.batch-base && 272 || 17 }}
        # Each contract's only copy. Every one runs even after another fails;
        # steps.py records the failed ones for a promotion to replay.
        env:
          # A promotion tests its release executable instead of compiling rui-release-safe-check.
          # Only this step sees it, so a bisect replay compiles each commit's own.
          RUI_UNDER_TEST: ${{ steps.release.outputs.rui }}
        run: |
          python3 -B tests/ci/steps.py --output-root "$RUNNER_TEMP/contracts" \
            'selftest=zig build renderer-contracts-selftest -j2 --summary all' \
            'pty=zig build direct-pty -j2 --summary all ${RUI_UNDER_TEST:+"-Drui-under-test=$RUI_UNDER_TEST"} -- --output "$STEP_OUTPUT" --jobs 2' \
            'ghostty=zig build direct-pty -j2 --summary all ${RUI_UNDER_TEST:+"-Drui-under-test=$RUI_UNDER_TEST"} -- --output "$STEP_OUTPUT" --jobs 2 --vectors "$PWD/tests/qualification/direct-pty/ghostty.json"' \
            'controls=zig build direct-pty-controls -j2 --summary all ${RUI_UNDER_TEST:+"-Drui-under-test=$RUI_UNDER_TEST"} -- --output "$STEP_OUTPUT"' \
            'recovery=zig build input-equivalence -j2 --summary all ${RUI_UNDER_TEST:+"-Drui-under-test=$RUI_UNDER_TEST"} -- --output "$STEP_OUTPUT"'
      - name: Save reusable caches even after failure
        if: ${{ always() }}
        uses: ./.github/actions/setup/caches
        with:
          save-only: 'true'
          setup-outcome: ${{ steps.setup.outcome }}
          work-outcome: ${{ steps.compile.outcome }}
      - name: Bisect the promotion batch with each failed step
        if: ${{ failure() && inputs.batch-base }}
        timeout-minutes: 240
        env:
          BASE: ${{ inputs.batch-base }}
          HEAD_SHA: ${{ inputs.ref }}
        run: python3 -B tests/ci/promotion.py --base "$BASE" --head "$HEAD_SHA" --logs "$RUNNER_TEMP/promotion-bisect"
      - name: Retain the bisect's verdict and replay logs
        if: ${{ failure() && inputs.batch-base }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-bisect-renderer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-bisect
          retention-days: 14
          if-no-files-found: ignore
      - name: Retain contract results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-contracts-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contracts
          retention-days: 3
          if-no-files-found: ignore
  mutations:
    # A promotion's workflow_call carries its dispatch event but runs no mutations.
    if: ${{ !github.event.repository.private && github.event_name == 'workflow_dispatch' && !inputs.ref }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [test, test-logic]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          targets: '["test", "test-logic", "terminal-restoration-integration"]'
          check-part: renderer-mutations
      - name: Require behavioral kills in isolated source copies
        id: compile
        # Cache timing: green 464 s, run 42754650502; minimum margin 120 s.
        # Limit = job budget - cold setup allowance - save reserve.
        timeout-minutes: 32
        env:
          TARGET: ${{ matrix.target }}
        run: python3 -B tests/ci/renderer_mutation.py --target "$TARGET" --output "$RUNNER_TEMP/mutations"
      - name: Save reusable caches even after failure
        if: ${{ always() }}
        uses: ./.github/actions/setup/caches
        with:
          save-only: 'true'
          setup-outcome: ${{ steps.setup.outcome }}
          work-outcome: ${{ steps.compile.outcome }}
      - name: Retain counterexamples, patches and command logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-mutations-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutations
          retention-days: 3
          if-no-files-found: ignore
