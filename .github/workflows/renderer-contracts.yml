name: Renderer contracts (Linux)
on:
  workflow_dispatch:
  push:
    branches: ['td3/**', 'perf/diag-td3-*']
  pull_request:
    paths:
      - 'src/**'
      - 'build.zig*'
      - 'tests/ci/renderer_mutation*'
      - 'tests/integration/session_sequence_model*.py'
      - 'tests/integration/input_equivalence.py'
      - 'tests/qualification/direct-pty/**'
      - '.github/workflows/renderer-contracts.yml'

# Additive contract checks only. Existing selected and frozen qualification
# workflows keep their cadence, targets and assertions.
cache-mode: read
permissions:
  contents: read

concurrency:
  group: renderer-contracts-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    # Diagnostic pushes exclude Selected checks, including its policy job.
    # These are fresh diagnostic checks, not acceptance of that omitted gate.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Record diagnostic policy inputs
        run: |
          mkdir -p .amp/td3/policy
          git rev-parse HEAD > .amp/td3/policy/revision.txt
          sha256sum .github/workflows/check.yml .github/workflows/renderer-contracts.yml > .amp/td3/policy/workflows.sha256
      - name: Test CI policy on the diagnostic head
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s tests/ci -v 2>&1 | tee .amp/td3/policy/python.log
      - name: Test cache policy on the diagnostic head
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          node --test tests/ci/*.test.cjs 2>&1 | tee .amp/td3/policy/node.log
      - name: Install the pinned workflow linter
        if: ${{ !cancelled() }}
        id: linter
        run: |
          set -euo pipefail
          curl --fail --location --show-error --connect-timeout 10 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate workflows with the read-only cache-mode exception
        if: ${{ !cancelled() && steps.linter.outcome == 'success' }}
        run: |
          set -euo pipefail
          for workflow in .github/workflows/*.yml; do
            if grep -qx 'cache-mode: read' "$workflow"; then
              actionlint -shellcheck= -ignore '^unexpected key "cache-mode" for "workflow" section\.' "$workflow"
            else
              actionlint -shellcheck= "$workflow"
            fi
          done 2>&1 | tee .amp/td3/policy/actionlint.log
      - name: Retain diagnostic policy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-policy-${{ github.sha }}-${{ github.run_attempt }}
          path: .amp/td3/policy
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  mutations:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [test, test-logic, sequence-model]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          targets: '["test", "test-logic", "human-cli-integration"]'
          check-part: renderer-contracts
      - name: Test mutation evidence classification and isolation
        run: |
          mkdir -p .amp/td3
          set -o pipefail
          python3 tests/ci/renderer_mutation_test.py 2>&1 | tee .amp/td3/mutation-selftests.log
      - name: Test executed-overlay identity and internal build health
        run: |
          set -o pipefail
          python3 tests/integration/session_sequence_model_test.py -v 2>&1 | tee .amp/td3/model-selftests.log
      - name: Require behavioral kills in isolated source copies
        env:
          TARGET: ${{ matrix.target }}
        run: python3 tests/ci/renderer_mutation.py --target "$TARGET" --output .amp/td3/mutations
      - name: Retain exact-source counterexamples, patches and command logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-mutations-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .amp/td3
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  contracts:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          targets: '["test", "test-logic", "terminal-restoration-integration"]'
          check-part: renderer-contracts-native
      - name: Build one production artifact for the independent PTY suites
        id: production
        run: |
          mkdir -p .amp/td3/contracts
          git rev-parse HEAD > .amp/td3/contracts/revision.txt
          zig build -j2 -Doptimize=ReleaseSafe --summary all
          sha256sum zig-out/bin/rui > .amp/td3/contracts/binary.sha256
      - name: TD2 complete binding contracts (case27 remains mandatory)
        run: |
          ulimit -Sn 256
          set -o pipefail
          zig build test-logic -j2 -Dtest-filter=TD2 --summary all 2>&1 | tee .amp/td3/contracts/td2.log
      - name: TD1 sequences through actual frontend transitions
        if: ${{ !cancelled() }}
        run: |
          ulimit -Sn 256
          python3 tests/integration/session_sequence_model.py --source "$PWD" --output .amp/td3/contracts/td1
      - name: TD4 driver and disposal controls
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: |
          python3 tests/qualification/direct-pty/test_driver.py -v
          python3 tests/qualification/direct-pty/controls.py "$PWD/zig-out/bin/rui" --output .amp/td3/contracts/controls
      - name: TD4 direct PTY and short tmux smoke
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: python3 tests/qualification/direct-pty/matrix.py "$PWD/zig-out/bin/rui" --output .amp/td3/contracts/pty --jobs 4
      - name: Ghostty primary input contracts (mandatory, separate from smoke)
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: python3 tests/qualification/direct-pty/matrix.py "$PWD/zig-out/bin/rui" --output .amp/td3/contracts/ghostty --jobs 4 --vectors tests/qualification/direct-pty/ghostty.json
      - name: TD2 original-recovery encoding contracts
        if: ${{ !cancelled() && steps.production.outcome == 'success' }}
        run: python3 tests/integration/input_equivalence.py "$PWD/zig-out/bin/rui" --output .amp/td3/contracts/recovery
      - name: Retain each independent result without masking mandatory failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-contracts-${{ github.sha }}-${{ github.run_attempt }}
          path: .amp/td3/contracts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
