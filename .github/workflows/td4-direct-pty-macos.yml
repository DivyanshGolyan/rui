name: TD4 direct-PTY hosted macOS (exact branch commit)
# TD5-owned runner for TD4's harness. Runs the exact TD4 commit unchanged on
# hosted Apple Silicon; this diagnostic branch never lints or lands.
on:
  push:
    branches: ['perf/diag-td4-macos']
permissions:
  contents: read
cache-mode: read
env:
  TD4_SHA: be2a7c002ea29d1c908c03e8b69c1ad0a17b7e2e
jobs:
  direct-pty:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TD4_SHA }}
          persist-credentials: false
      - name: Exact commit
        run: test "$(git rev-parse HEAD)" = "$TD4_SHA"
      - uses: ./.github/actions/setup
      - name: Build the exact commit (ReleaseSafe, as the harness README)
        run: |
          set -euo pipefail
          started=$SECONDS
          zig build -Doptimize=ReleaseSafe --summary all > "$RUNNER_TEMP/build.log" 2>&1 || { tail -50 "$RUNNER_TEMP/build.log"; exit 1; }
          echo "build: $((SECONDS - started))s"
          shasum -a 256 zig-out/bin/rui
      - name: Harness interpreter and tmux
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" --disable-pip-version-check install --retries 1 -r tests/qualification/direct-pty/requirements.txt
          command -v tmux >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install tmux
          mkdir -p "$RUNNER_TEMP/evidence"
          { sw_vers; sysctl hw.model hw.ncpu hw.memsize; tmux -V; "$RUNNER_TEMP/venv/bin/python" --version; } | tee "$RUNNER_TEMP/evidence/environment.txt"
      - name: Baseline - driver tests, controls and default matrix (default soft open-file limit)
        run: |
          set -euo pipefail
          ulimit -S -n 256
          test "$(ulimit -Sn)" = 256
          { ulimit -Sn; ulimit -Hn; } | tee -a "$RUNNER_TEMP/evidence/environment.txt"
          unset TMUX TMUX_PANE
          py="$RUNNER_TEMP/venv/bin/python"
          rui="$GITHUB_WORKSPACE/zig-out/bin/rui"
          status=0
          started=$SECONDS; "$py" -B tests/qualification/direct-pty/test_driver.py -v > "$RUNNER_TEMP/evidence/test_driver.log" 2>&1 || status=1
          echo "test_driver: $((SECONDS - started))s status=$status"
          started=$SECONDS; "$py" -B tests/qualification/direct-pty/controls.py "$rui" --output "$RUNNER_TEMP/evidence/controls" > "$RUNNER_TEMP/evidence/controls.log" 2>&1 || status=1
          echo "controls: $((SECONDS - started))s status=$status"
          started=$SECONDS; "$py" -B tests/qualification/direct-pty/matrix.py "$rui" --output "$RUNNER_TEMP/evidence/matrix" --jobs 4 > "$RUNNER_TEMP/evidence/matrix.log" 2>&1 || status=1
          echo "matrix: $((SECONDS - started))s status=$status"
          tail -5 "$RUNNER_TEMP/evidence/test_driver.log" "$RUNNER_TEMP/evidence/controls.log" "$RUNNER_TEMP/evidence/matrix.log"
          exit "$status"
      - name: Mandatory Ghostty vectors (separate outcome; known failures fail the job)
        # Runs even when the baseline fails so both outcomes are recorded; no
        # continue-on-error, so a failing Ghostty vector leaves the job red.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ulimit -S -n 256
          unset TMUX TMUX_PANE
          started=$SECONDS; status=0
          "$RUNNER_TEMP/venv/bin/python" -B tests/qualification/direct-pty/matrix.py "$GITHUB_WORKSPACE/zig-out/bin/rui" \
            --output "$RUNNER_TEMP/evidence/ghostty" --jobs 4 --vectors tests/qualification/direct-pty/ghostty.json \
            > "$RUNNER_TEMP/evidence/ghostty.log" 2>&1 || status=$?
          echo "ghostty: $((SECONDS - started))s status=$status"
          tail -20 "$RUNNER_TEMP/evidence/ghostty.log"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: td4-direct-pty-macos-${{ env.TD4_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
