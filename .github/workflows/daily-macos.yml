name: Daily changed-main macOS
on:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-macos
  cancel-in-progress: true
jobs:
  changed:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.main.outputs.changed }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: main
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'daily-macos.yml', status: 'completed',
              branch: 'main', event: 'schedule', per_page: 1
            });
            const previous = data.workflow_runs[0];
            const changed = !previous || previous.head_sha !== context.sha;
            core.setOutput('changed', String(changed));
            await core.summary.addRaw(`Scheduled main SHA: ${context.sha}. ` +
              (changed ? 'Run fresh sharded native qualification.' :
                `Unchanged since prior ${previous.conclusion} attempt; no retry or new test evidence.`)).write();
  macos:
    needs: changed
    if: ${{ needs.changed.outputs.changed == 'true' }}
    uses: ./.github/workflows/qualify-macos.yml
    with:
      ref: ${{ github.sha }}
      platform: macos
      # Mac check-full, the resource campaign and its memory reruns run here
      # daily instead of on each candidate.
      suite: all
  report:
    needs: [changed, macos]
    if: ${{ always() && needs.changed.outputs.changed == 'true' && needs.macos.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File each failure under its cause
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/report_issue.py --workflow "Daily macOS qualification" --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA"
