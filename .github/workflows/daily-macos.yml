name: Daily changed-main macOS
on:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-macos
  cancel-in-progress: true
jobs:
  changed:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.main.outputs.changed }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: main
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'daily-macos.yml', status: 'completed',
              branch: 'main', event: 'schedule', per_page: 1
            });
            const previous = data.workflow_runs[0];
            const changed = !previous || previous.head_sha !== context.sha;
            core.setOutput('changed', String(changed));
            await core.summary.addRaw(`Scheduled main SHA: ${context.sha}. ` +
              (changed ? 'Run fresh sharded native qualification.' :
                `Unchanged since prior ${previous.conclusion} attempt; no retry or new test evidence.`)).write();
  macos:
    needs: changed
    if: ${{ needs.changed.outputs.changed == 'true' }}
    uses: ./.github/workflows/qualify-macos.yml
    with:
      ref: ${{ github.sha }}
      platform: macos
      # Mac check-full, the resource campaign and its memory reruns run here
      # daily instead of on each candidate.
      suite: all
  report:
    needs: [changed, macos]
    if: ${{ always() && needs.changed.outputs.changed == 'true' && needs.macos.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: File an issue for the failed daily run
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.macos.result }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -B tests/ci/main_health.py report \
            --title "Daily macOS qualification failed on ${GITHUB_SHA::12}" \
            --body "Daily macOS qualification (check-full, resources) on main $GITHUB_SHA: $RESULT. $URL"
