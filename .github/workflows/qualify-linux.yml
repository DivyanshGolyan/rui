name: Linux qualification
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to qualify
        type: string
        default: main
        required: true
      suite:
        description: Existing native gates, resource workloads, or both
        type: choice
        options: [native, resources, all, footprint]
        default: native
        required: true
  schedule:
    - cron: '13 6 * * *'
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    if: ${{ !github.event.repository.private }}
    uses: ./.github/workflows/qualify-macos.yml
    with:
      platform: linux
      ref: ${{ inputs.ref || github.sha }}
      # Full native acceptance is the daily backstop. Resource campaigns remain
      # explicit until platform counters and shared-runner behavior qualify.
      # Linux cannot qualify macOS footprint. Never mask a resource gate's exit.
      suite: ${{ inputs.suite || 'native' }}
  report:
    needs: qualify
    # Daily runs on main catch drift and flakes after landing; red files an issue.
    if: ${{ always() && !github.event.repository.private && github.event_name == 'schedule' && needs.qualify.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File an issue for the failed daily run
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.qualify.result }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -B tests/ci/report_issue.py \
            --title "Daily Linux qualification failed" \
            --body "Daily Linux native qualification on main $GITHUB_SHA: $RESULT. $URL"
