name: Statement table
# Keeps src/store/rsql_table.zig current (docs/contracts/store.md, Store statement table). The table
# only makes statements compile fast, so a stale one costs minutes, never correctness, and no release
# waits on it. Promote's daily run starts this as its own run; also runnable by hand. When the table
# differs from what a collect build renders, this opens a draft PR with the regenerated file; a
# thread or person marks it ready, which starts the PR tier (a PR the workflow token opens starts none).
on:
  workflow_dispatch:
permissions:
  contents: read
# The regeneration reads main's caches and never publishes them.
cache-mode: read
concurrency:
  group: statement-table
jobs:
  regenerate:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGETS: '["test-native","test-store","session-list-integration"]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stop when a regeneration PR is already open
        id: open
        run: |
          set -euo pipefail
          open=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("statement-table/"))] | length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          echo "open regeneration PRs: $open"
      - uses: ./.github/actions/setup
        if: ${{ steps.open.outputs.open == '0' }}
        with:
          targets: ${{ env.TARGETS }}
          publish-caches: 'false'
      - name: Compare the table with a collect build
        id: check
        if: ${{ steps.open.outputs.open == '0' }}
        continue-on-error: true
        run: python3 -B tests/ci/rsql_table.py check --zig "$(command -v zig)"
      - name: Regenerate the table and open a draft PR
        if: ${{ steps.open.outputs.open == '0' && steps.check.outcome == 'failure' }}
        run: |
          set -euo pipefail
          python3 -B tests/ci/rsql_table.py generate --zig "$(command -v zig)"
          python3 -B tests/ci/rsql_table.py fingerprint
          branch="statement-table/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/store/rsql_table.zig
          git commit -m "Regenerate the Store statement table"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "Regenerate the Store statement table" \
            --body "No issue: the scheduled statement-table run found src/store/rsql_table.zig differing from a collect build and regenerated it with \`python3 tests/ci/rsql_table.py generate\`. Mark ready for review to start CI, then merge on green."
