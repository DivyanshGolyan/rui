name: Main health
# After each main push's CI: advance stable when green; revert and freeze on a
# Store/recovery/upgrade red; otherwise file an issue. See tests/ci/main_health.py.
on:
  workflow_run:
    workflows: [Selected checks, Previous installed-release upgrade]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  # A revert pushed with this token starts no workflows; it dispatches main's CI.
  actions: write

concurrency:
  # One decision at a time; a running revert or stable push is never cancelled.
  # A newer queued run replaces a pending one, so each run decides every push
  # since stable rather than only its own event.
  group: main-health
  cancel-in-progress: false

jobs:
  decide:
    # GITHUB_TOKEN pushes (auto-land, revert) get dispatched post-push runs.
    if: ${{ contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Trusted main code decides; the revert, if any, lands on main.
          ref: main
          fetch-depth: 0
      - name: Advance stable, or revert and freeze, or file an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/main_health.py check
