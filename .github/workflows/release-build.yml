name: Release build
# Promote (promote.yml, scheduled or by hand) calls this first,
# beside qualification, with the main SHA they qualify. It numbers the release
# and builds the archives the qualification tiers test and Release (release.yml)
# publishes unchanged once every tier is green. It publishes nothing. The
# archives stay seven days, so Promote can publish a commit an earlier run
# qualified days earlier; past that, Promote qualifies the commit again.
on:
  workflow_call:
    inputs:
      sha:
        description: Main commit SHA under promotion (not a branch or PR ref)
        type: string
        required: true
    outputs:
      version:
        description: Planned release version; empty when a published release already includes the SHA
        value: ${{ jobs.plan.outputs.version }}
      sha:
        description: The immutable SHA the archives were built from
        value: ${{ jobs.plan.outputs.sha }}

permissions:
  contents: read

# Released bytes come from cold builds; the release publishes no caches.
cache-mode: read

jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Draft reservations are visible only with push access. This job never writes.
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          python3 -B tests/ci/release.py plan "$SHA" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: ${{ needs.plan.outputs.version != '' }}
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # Portable targets: baseline CPUs and the oldest libc each build links.
          # host_launch.c needs closefrom from glibc 2.34; Zig's macOS minimum is 15.
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-linux-gnu.2.34
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-linux-gnu.2.34
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          publish-caches: 'false'
          # Released bytes never come from shared build caches.
          cold: 'true'
      - name: Build and check the tagged release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # build.zig reads the version from this local tag.
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "v$VERSION^{commit}")" = "$SHA"
          else
            git tag "v$VERSION" "$SHA"
          fi
          name="rui-$VERSION-$PLATFORM"
          zig build -Doptimize=ReleaseSafe "-Dtarget=$TARGET" --prefix "$RUNNER_TEMP/$name" --summary all
          mkdir dist
          if [ "$(uname -s)" = Linux ]; then
            # Debug info is most of a Linux executable, so it ships as a separate archive.
            # Extracted beside the executable, Zig crash traces find it through .gnu_debuglink.
            mkdir -p "$RUNNER_TEMP/debug/$name/bin"
            debug_file="$RUNNER_TEMP/debug/$name/bin/rui.debug"
            objcopy --only-keep-debug "$RUNNER_TEMP/$name/bin/rui" "$debug_file"
            objcopy --strip-all "--add-gnu-debuglink=$debug_file" "$RUNNER_TEMP/$name/bin/rui"
            tar -czf "dist/$name-debug.tar.gz" -C "$RUNNER_TEMP/debug" "$name"
          fi
          test "$("$RUNNER_TEMP/$name/bin/rui" --version)" = "rui $VERSION ($SHA)"
          if [ "$(uname -s)" = Darwin ]; then otool -L "$RUNNER_TEMP/$name/bin/rui"; else ldd "$RUNNER_TEMP/$name/bin/rui"; fi
          COPYFILE_DISABLE=1 tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rui-${{ matrix.platform }}
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error
  npm:
    # The npm tarballs: the compiled client (npm name ruicode) and one package per platform. Release's npm_publish publishes them.
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Pack the tarballs from the built executables and record every digest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for delay in 10 30 ''; do
            rm -rf "$RUNNER_TEMP/artifacts"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'rui-*' --dir "$RUNNER_TEMP/artifacts" && break
            test -n "$delay" || exit 1
            echo "::warning::Artifact download failed; retrying in ${delay}s"
            sleep "$delay"
          done
          executables=()
          for platform in linux-x86_64 linux-arm64 darwin-arm64; do
            name="rui-$VERSION-$platform"
            mkdir -p "$RUNNER_TEMP/unpacked"
            tar -xzf "$(find "$RUNNER_TEMP/artifacts" -name "$name.tar.gz")" -C "$RUNNER_TEMP/unpacked"
            executables+=("$platform=$RUNNER_TEMP/unpacked/$name/bin/rui")
          done
          cd clients/ts
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/pack.mjs "$VERSION" "$RUNNER_TEMP/npm" "${executables[@]}"
          ls -l "$RUNNER_TEMP/npm"
          # Release publishes exactly these bytes: it checks them against this record.
          mkdir "$RUNNER_TEMP/digests"
          find "$RUNNER_TEMP/artifacts" -name "rui-$VERSION-*.tar.gz" -print0 |
            xargs -0 -I{} sh -c 'cd "$(dirname "$1")" && sha256sum "$(basename "$1")"' sh {} > "$RUNNER_TEMP/digests/SHA256SUMS"
          (cd "$RUNNER_TEMP/npm" && sha256sum rui-*.tgz) >> "$RUNNER_TEMP/digests/SHA256SUMS"
          sort -k2 -o "$RUNNER_TEMP/digests/SHA256SUMS" "$RUNNER_TEMP/digests/SHA256SUMS"
          { echo '### Release digests'; echo; echo '```'; cat "$RUNNER_TEMP/digests/SHA256SUMS"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rui-npm
          path: ${{ runner.temp }}/npm/*.tgz
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rui-digests
          path: ${{ runner.temp }}/digests/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
