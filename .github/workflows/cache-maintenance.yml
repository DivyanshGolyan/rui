name: Maintain shared build caches
on:
  push:
    branches: [main]
    # Refresh immediately when compatibility inputs change. Ordinary source edits
    # use the daily baseline, avoiding two extra production builds per merge.
    paths:
      - 'build.zig*'
      - 'src/build_*'
      - 'src/*.patch'
      - '.github/actions/setup/**'
      - '.github/workflows/cache-maintenance.yml'
      - '.github/scripts/prune-caches.cjs'
  schedule:
    - cron: '43 5 * * *'
  workflow_run:
    workflows: [Selected checks, Daily changed-main macOS, On-demand macOS qualification, Scheduled cold acceptance, Renderer contracts]
    types: [completed]

permissions:
  contents: read

concurrency:
  # Completion cleanups must not replace a pending scheduled/push baseline.
  group: cache-maintenance-${{ github.event_name == 'workflow_run' && 'prune' || 'baseline' }}
  # Finish cache saves; only superseded pending refreshes may be replaced.
  cancel-in-progress: false

jobs:
  prune:
    needs: baseline
    # Job completion includes post-job saves. A successful matrix peer can save
    # even when another fails; workflow_run skips baseline but still cleans up.
    if: ${{ always() && !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run uses the default-branch SHA, never the producer's head.
          # Do not restore its caches or download its artifacts in this job.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Remove obsolete Rui cache snapshots
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/prune-caches.cjs')({github, context, core});
  baseline:
    if: ${{ github.event_name != 'workflow_run' && !github.event.repository.private && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          check-part: baseline
      - name: Warm production compilation, not test acceptance
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          zig build -Doptimize=ReleaseSafe --summary all
          echo "Compilation cache baseline for $(git rev-parse HEAD) on $(uname -s)/$(uname -m). No test acceptance or release qualification." >> "$GITHUB_STEP_SUMMARY"
  previous_release:
    # The upgrade check restores this; requested refs cannot publish caches.
    if: ${{ github.event_name != 'workflow_run' && !github.event.repository.private && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          check-part: previous-release
      - name: Check out the pinned previous release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep in step with previous-release-upgrade.yml.
          ref: 0e4b2225d106dd63fa9c38801188facb5e9c6335
          path: .amp/previous-release
          persist-credentials: false
      - run: mv .amp/previous-release "$RUNNER_TEMP/previous-release"
      - name: Restore the existing previous-release compilation
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/previous-release/.zig-cache
            ${{ runner.temp }}/previous-release/zig-pkg
          key: rui-previous-release-${{ runner.os }}-${{ runner.arch }}-0.17.0-0e4b2225d106dd63fa9c38801188facb5e9c6335
      - name: Build the previous release as its installer does
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        working-directory: ${{ runner.temp }}/previous-release
        run: |
          set -euo pipefail
          bash src/fetch_dependencies.sh
          zig build -Doptimize=ReleaseSafe --prefix "$RUNNER_TEMP/previous-install" --summary all
      - name: Publish the previous-release compilation
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/previous-release/.zig-cache
            ${{ runner.temp }}/previous-release/zig-pkg
          key: ${{ steps.restore.outputs.cache-primary-key }}
