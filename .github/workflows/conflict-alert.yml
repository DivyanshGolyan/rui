name: Conflict alert
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: conflict-alert
  cancel-in-progress: true
jobs:
  alert:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comment on each open PR that this push left conflicting
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
        run: python3 -B tests/ci/conflict_alert.py
