name: On-demand macOS qualification
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      suite:
        type: string
        default: native
      platform:
        type: string
        default: macos
  workflow_dispatch:
    inputs:
      ref:
        description: Rui branch, tag or commit to qualify (resolved once for every job)
        required: true
        default: main
        type: string
      suite:
        description: Existing suites, one isolated job per target or full-check partition
        required: true
        default: footprint
        type: choice
        options: [footprint, resources, native, all]

permissions:
  contents: read
  actions: read

# Requested refs execute their own setup/build code, but must not publish
# caches into the dispatching workflow's trusted ref. Tokens enforce this cap.
cache-mode: read

concurrency:
  group: qualification-${{ inputs.platform || 'macos' }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      platform: ${{ steps.plan.outputs.platform }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: plan
        env:
          SUITE: ${{ inputs.suite }}
          PLATFORM: ${{ inputs.platform || 'macos' }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          python3 tests/ci/qualification.py --suite "$SUITE" --platform "$PLATFORM" > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          rows = json.load(open('matrix.json'))['include']
          targets = {target for row in rows for target in row['targets']}
          if any(row['resource'] for row in rows):
              targets.add('measurement-check')
          print('targets=' + json.dumps(sorted(targets)))
          PY
  compile:
    needs: plan
    runs-on: ${{ needs.plan.outputs.platform == 'linux' && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          targets: ${{ needs.plan.outputs.targets }}
          check-part: compiled
      - name: Compile selected gates once, never test acceptance
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: python3 -B tests/ci/build_artifact.py build "$TARGETS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish
        with:
          name: compiled-${{ needs.plan.outputs.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-compiled
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  qualify:
    needs: [plan, compile]
    name: ${{ needs.plan.outputs.platform }} / ${{ matrix.name }}
    runs-on: ${{ needs.plan.outputs.platform == 'linux' && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: 30
    strategy:
      # Separate VMs avoid measuring concurrent qualification workloads on one Mac.
      fail-fast: false
      max-parallel: ${{ needs.plan.outputs.platform == 'linux' && 10 || 3 }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Select runner-owned evidence directories
        run: |
          echo "EVIDENCE=$RUNNER_TEMP/qualification-evidence" >> "$GITHUB_ENV"
          echo "RUI_FAILURE_ARTIFACTS=$RUNNER_TEMP/qualification-evidence/failures" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Record the actual VM and source before setup
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          TARGETS: ${{ toJSON(matrix.targets) }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          {
            printf 'requested_ref=%s\nworkflow_sha=%s\ntargets=%s\n' "$REQUESTED_REF" "$WORKFLOW_SHA" "$TARGETS"
            git rev-parse HEAD
            git status --porcelain
            uname -a
            if [ "$(uname -s)" = Darwin ]; then
              sw_vers
              sysctl hw.model hw.ncpu hw.memsize
              sysctl vm.swapusage
              memory_pressure
              xcodebuild -version
              xcrun --sdk macosx --show-sdk-version
              test "$(uname -m)" = arm64
            else
              nproc
              free -m
              test "$(uname -m)" = x86_64
            fi
            df -h "${TMPDIR:-/tmp}"
            ulimit -a
          } | tee "$EVIDENCE/environment.txt"
          echo "Tested SHA $(git rev-parse HEAD); hosted $(uname -s)/$(uname -m). VM-specific resource evidence, not personal-machine or pacing equivalence." >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup
        id: setup
        with:
          targets: ${{ needs.plan.outputs.targets }}
          compiled: 'true'
      - name: Verify the successful producer's compiled artifact
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          ARTIFACT_ID: ${{ needs.compile.outputs.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/build_artifact.py restore "$TARGETS" --artifact-id "$ARTIFACT_ID"
      - name: Record the compiler used by every suite
        run: zig version | tee "$EVIDENCE/zig-version.txt"
      - name: Existing measurement setup and tests
        id: measurement
        if: ${{ matrix.resource }}
        run: |
          set -euo pipefail
          { zig version; go version; shasum -a 256 tests/qualification/go.mod tests/qualification/go.sum; } | tee "$EVIDENCE/toolchains.txt"
          GOTOOLCHAIN=local go -C tests/qualification mod download
          zig build measurement-check -Dci-artifacts=.zig-cache/o/ci-compiled -j2 --summary all 2>&1 | tee "$EVIDENCE/measurement-check.log"
      - name: Execute the existing gates without changing their verdicts
        id: gates
        env:
          TARGETS: ${{ toJSON(matrix.targets) }}
          PART: ${{ matrix.part }}
          RESOURCE: ${{ matrix.resource }}
          ARGS: ${{ toJSON(matrix.args) }}
        run: |
          set -euo pipefail
          if [ "$RESOURCE" = true ]; then
            target=$(python3 -c 'import json,os; print(json.loads(os.environ["TARGETS"])[0])')
            trap 'cat "$EVIDENCE/build.log" >&2' EXIT
            # This existing runner publishes a summary plus compressed evidence
            # to files instead of stdout; keep both under the upload directory.
            if [ "$target" = measure-execution-service ]; then
              zig build "$target" -Dci-artifacts=.zig-cache/o/ci-compiled -j2 --summary all -- --output "$EVIDENCE/result.json" 2> "$EVIDENCE/build.log" | tee "$EVIDENCE/runner.log"
            else
              python3 - <<'PY' 2> "$EVIDENCE/build.log" | tee "$EVIDENCE/result.json"
          import json, os, subprocess
          target = json.loads(os.environ['TARGETS'])[0]
          args = json.loads(os.environ['ARGS'])
          command = ['zig', 'build', target, '-Dci-artifacts=.zig-cache/o/ci-compiled', '-j2', '--summary', 'all']
          raise SystemExit(subprocess.call(command + (['--', *args] if args else [])))
          PY
            fi
          else
            python3 -B tests/ci/run_selected.py "$TARGETS" --check-part "$PART" --ci-artifacts .zig-cache/o/ci-compiled 2>&1 | tee "$EVIDENCE/gates.log"
          fi
      - name: Retain raw measurement diagnostics, never Stores or payload files
        id: retention
        if: ${{ always() && matrix.resource }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, shutil, stat, tempfile
          destination = pathlib.Path(os.environ['EVIDENCE'])
          destination.mkdir(parents=True, exist_ok=True)
          receipt = {'copied': [], 'omitted': [], 'limits': '4 MiB/file, 64 MiB total'}
          remaining = 64 * 1024 * 1024
          # Only fixture-created roots and known diagnostic labels. Do not upload
          # whole temporary trees: they also contain Store, HOME and result data.
          labels = re.compile(r'(?:.*footprint.*\.(?:txt|json)(?:\.[a-z-]+\.json|\.json)?|host-(?:heap|vmmap)\.txt|(?:controller-)?facts\.jsonl)')
          parents = {pathlib.Path('/private/tmp').resolve(), pathlib.Path(tempfile.gettempdir()).resolve()}
          roots = sorted({root for parent in parents for root in parent.glob('rui-*')})
          for root in roots:
              if root.is_symlink() or not root.is_dir():
                  continue
              for directory, children, names in os.walk(root, followlinks=False):
                  children[:] = [n for n in children if not (pathlib.Path(directory, n).is_symlink()
                      or any(word in n.lower() for word in ('store', 'home', 'credential', 'scratch', 'auth')))]
                  for name in sorted(names):
                      if not labels.fullmatch(name):
                          continue
                      source = pathlib.Path(directory, name)
                      info = source.lstat()
                      if not stat.S_ISREG(info.st_mode):
                          continue
                      relative = pathlib.Path('raw', root.name, source.relative_to(root))
                      if info.st_size > min(4 * 1024 * 1024, remaining):
                          receipt['omitted'].append(str(relative))
                          continue
                      target = destination / relative
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
                      remaining -= info.st_size
                      receipt['copied'].append(str(relative))
          (destination / 'retention.json').write_text(json.dumps(receipt, indent=2))
          PY
          if [ "$(uname -s)" = Darwin ]; then
            { sysctl vm.swapusage; memory_pressure; df -h /private/tmp; } > "$EVIDENCE/environment-after.txt"
          else
            { free -m; df -h /tmp; } > "$EVIDENCE/environment-after.txt"
          fi
      - name: Retain setup's actual native-tool identity even if setup failed
        if: ${{ always() }}
        run: |
          mkdir -p "$EVIDENCE"
          if [ -f "$RUNNER_TEMP/rui-native-tools.txt" ]; then
            cp "$RUNNER_TEMP/rui-native-tools.txt" "$EVIDENCE/native-tools.txt"
          fi
      - name: Upload evidence even after a failed qualification
        id: evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.platform }}-${{ matrix.name }}-${{ needs.plan.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          retention-days: 3
          if-no-files-found: warn
      - name: Summarize outcome and evidence
        if: ${{ always() }}
        env:
          NAME: ${{ matrix.name }}
          PART: ${{ matrix.part }}
          SETUP: ${{ steps.setup.outcome }}
          MEASUREMENT: ${{ steps.measurement.outcome }}
          GATES: ${{ steps.gates.outcome }}
          RETENTION: ${{ steps.retention.outcome }}
          ARTIFACT: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              print(f"\n### {os.environ['NAME']} (partition {os.environ['PART']})", file=output)
              for key in ('SETUP', 'MEASUREMENT', 'GATES', 'RETENTION'):
                  print(f"- {key.lower()}: {os.environ[key] or 'unavailable'}", file=output)
              artifact = os.environ['ARTIFACT']
              print(f'\n[Evidence (expires after three days)]({artifact})' if artifact else '\nArtifact unavailable.', file=output)
              print('\nInspect the failed step and retained diagnostics before rerunning. A skipped gate or missing measurement is not acceptance; hosted measurements describe this VM only.', file=output)
          PY
