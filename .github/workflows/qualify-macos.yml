name: Renderer backpressure diagnostic only
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true
      suite:
        type: string
        default: native
permissions:
  contents: read
jobs:
  distinguish:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          targets: '["check-full"]'
      - name: Record diagnostic identity
        run: |
          mkdir -p .amp/diagnostic
          git rev-parse HEAD | tee .amp/diagnostic/identity.txt
          git diff 020bc525220b9a3ef6845b2c4ec6a8cecac9bc94 -- src/ | tee -a .amp/diagnostic/identity.txt
          ulimit -n 256
          ulimit -n | tee -a .amp/diagnostic/identity.txt
      - name: Old witness, exact scratch4 product, actual input observations
        run: |
          set -o pipefail
          ulimit -n 256
          RUI_BACKPRESSURE_DIAG=old zig build terminal-restoration-integration -j2 --summary all -- renderer-backpressure 2>&1 | tee .amp/diagnostic/old.log
      - name: Controlled PTY output, same scratch4 product
        continue-on-error: true
        run: |
          set -o pipefail
          ulimit -n 256
          RUI_BACKPRESSURE_DIAG=new zig build terminal-restoration-integration -j2 --summary all -- renderer-backpressure 2>&1 | tee .amp/diagnostic/new.log
      - name: Restore conversion bug as a sensitivity control
        run: |
          set -o pipefail
          ulimit -n 256
          git apply .github/renderer-handoff-mutation.patch
          RUI_BACKPRESSURE_DIAG=mutation zig build terminal-restoration-integration -j2 --summary all -- renderer-backpressure 2>&1 | tee .amp/diagnostic/mutation.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: renderer-backpressure-diagnostic
          path: .amp/diagnostic
          retention-days: 3
