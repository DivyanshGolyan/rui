name: perf diagnostic helper fixture start
# Temporary diagnostic branch only: which interpreters stall on a fresh process's first loopback reverse lookup?
on:
  push:
    branches: ['perf/diag-fixture']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Which process property makes the first loopback lookup stall
        run: |
          d=.github/diag; o="$RUNNER_TEMP"
          clang -O1 -o "$o/plain" $d/lookup.c
          clang -O1 -mmacosx-version-min=10.13 -o "$o/min1013" $d/lookup.c
          clang -O1 -mmacosx-version-min=11.0 -o "$o/min11" $d/lookup.c
          clang -O1 -framework CoreFoundation -o "$o/cf" $d/lookup_cf.c
          vtool -show-build "$o/min1013" | grep -E 'minos|version' | head -2
          vtool -show-build "$(/opt/homebrew/bin/python3 -c 'import sys; print(sys.executable)')" 2>/dev/null | grep -E 'minos|sdk' | head -2
          vtool -show-build /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13 2>/dev/null | grep -E 'minos|sdk' | head -2
          ctypes='import ctypes,socket,struct,time
          libc=ctypes.CDLL(None); libc.gethostbyaddr.restype=ctypes.c_void_p
          a=socket.inet_aton("127.0.0.1"); s=time.monotonic(); r=libc.gethostbyaddr(a,4,2)
          print(f"python ctypes libc gethostbyaddr {time.monotonic()-s:.3f}s", flush=True)'
          (
            "$o/plain" & "$o/min1013" & "$o/min11" & "$o/cf" &
            /opt/homebrew/bin/python3 -I -S -c "$ctypes" | sed 's/^/brew -I -S: /' &
            /opt/homebrew/bin/python3 -I -S -c 'import socket,time; s=time.monotonic(); socket.gethostbyaddr("127.0.0.1"); print(f"brew -I -S socket {time.monotonic()-s:.3f}s")' &
            /opt/homebrew/bin/python3 -c 'import socket,time; s=time.monotonic(); socket.getaddrinfo("localhost", 0); print(f"brew getaddrinfo(localhost) {time.monotonic()-s:.3f}s")' &
            /opt/homebrew/bin/python3 -c 'import subprocess,time; s=time.monotonic(); print(subprocess.run([sys.argv[1]] if False else ["'"$o/plain"'"], capture_output=True, text=True).stdout.strip(), "as python child", f"{time.monotonic()-s:.3f}s")' &
            /usr/bin/python3 -c "$ctypes" | sed 's/^/apple 3.9: /' &
            wait
          ) 2>&1
          true
