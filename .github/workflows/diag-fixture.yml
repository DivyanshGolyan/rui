name: perf diagnostic helper fixture start
# Temporary diagnostic branch only: which interpreters stall on a fresh process's first loopback reverse lookup?
on:
  push:
    branches: ['perf/diag-fixture']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Is the stall the app-bundle process identity
        run: |
          o="$RUNNER_TEMP"
          app=$(/opt/homebrew/bin/python3 -c 'import sys; print(sys.executable)')
          brewexe=$(/opt/homebrew/bin/python3 -I -S -c 'import os,sys; print(os.path.realpath(sys._base_executable))')
          echo "sys.executable=$app base=$brewexe"
          ls /opt/homebrew/Cellar/python@3.14/*/Frameworks/Python.framework/Versions/3.14/Resources/Python.app/Contents/MacOS/
          bundled=$(ls -d /opt/homebrew/Cellar/python@3.14/*/Frameworks/Python.framework/Versions/3.14/Resources/Python.app/Contents/MacOS/Python)
          cp "$bundled" "$o/unbundled-python"
          ctypes='import ctypes,socket,sys,time
          libc=ctypes.CDLL(None); libc.gethostbyaddr.restype=ctypes.c_void_p
          a=socket.inet_aton("127.0.0.1"); s=time.monotonic(); libc.gethostbyaddr(a,4,2)
          print(f"{sys.argv[1]}: first libc gethostbyaddr {time.monotonic()-s:.3f}s ({sys.executable})", flush=True)'
          python3 -m venv "$o/uvenv" && "$o/uvenv/bin/pip" -q --disable-pip-version-check install uv==0.9.5 && "$o/uvenv/bin/uv" python install 3.14 2>&1 | tail -1
          standalone=$("$o/uvenv/bin/uv" python find 3.14 --no-project 2>/dev/null || true); echo "standalone=$standalone"
          started=$(date -u +%T)
          (
            "$o/unbundled-python" -I -S -c "$ctypes" unbundled-copy &
            "$bundled" -I -S -c "$ctypes" bundled-direct &
            [ -n "$standalone" ] && "$standalone" -I -S -c "$ctypes" python-build-standalone-3.14 &
            [ -n "$standalone" ] && "$standalone" -I -c 'import socket,time; s=time.monotonic(); socket.gethostbyaddr("127.0.0.1"); print(f"standalone socket.gethostbyaddr {time.monotonic()-s:.3f}s")' &
            wait
          ) 2>&1
          log show --start "$(date -u -v-2M '+%Y-%m-%d %H:%M:%S')" --style compact \
            --predicate 'process == "mDNSResponder" OR subsystem == "com.apple.networkextension" OR eventMessage CONTAINS[c] "local network" OR subsystem == "com.apple.TCC"' 2>/dev/null \
            | grep -i -E "python|local network|tcc|denied|privacy" | tail -25
          true
