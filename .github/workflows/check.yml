name: Selected checks
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Selected checks from base {0}', inputs.base) || '' }}
on:
  pull_request:
    # Edits and draft conversion never cancel a running candidate. A
    # retargeted PR runs again on its next push, or when reopened.
    types: [opened, synchronize, reopened, ready_for_review]
  # Diagnose a ref against a chosen base without publishing it.
  workflow_dispatch:
    inputs:
      base:
        description: Base commit; selection covers base..ref
        required: true
      native_targets:
        description: Optional JSON native target array for macOS diagnostics
        type: string
        default: ''
      cache_profile:
        description: Record Linux producer cache contents and filesystem reuse
        type: boolean
        default: false
  # Promotion qualifies main HEAD against the batch since stable (promote.yml).
  workflow_call:
    inputs:
      base:
        description: Last promoted commit; selection covers base..main HEAD
        required: true
        type: string
      promotion:
        description: Run the full suite on Linux and macOS and name each failing job's suspects in the batch
        required: true
        type: boolean
      # main-build.yml after each merge: never a test, never a promotion.
      compile_only:
        description: Compile every gate and unit root and type-check macOS; run no tests
        required: false
        default: false
        type: boolean
    secrets:
      # Promote passes it so promotion can route to rui-mac; without it routing stays hosted.
      MAC_RUNNER_STATUS_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read
  actions: read
  # Aggregates read GitHub's annotations to name a lost or never-acquired runner.
  checks: read

concurrency:
  group: selected-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}${{ inputs.promotion && format('-promotion-{0}', github.workflow) || '' }}${{ inputs.compile_only && '-compile' || '' }}
  cancel-in-progress: true

# Cache timeout accounting, not a setup deadline:
# setup-allowance-minutes: 25
# save-reserve-minutes: 3
# Selected 43832831879: setup 213 s; allow four further (200 s retry + 90 s request) windows.
# Leave setup uncapped: cold fetch outliers still have the original job budget.

jobs:
  mac_runner:
    # A pull request selects no native target (ci_plan.plan), so its routing decision is never read.
    if: ${{ github.event_name != 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      runs_on: ${{ steps.decide.outputs.runs_on || '"macos-15"' }}
      self_hosted: ${{ steps.decide.outputs.self_hosted || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tests/ci/mac_runner.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read the runner status snapshot
        continue-on-error: true
        env:
          MAC_RUNNER_STATUS_TOKEN: ${{ secrets.MAC_RUNNER_STATUS_TOKEN }}
        run: |
          if [ -n "$MAC_RUNNER_STATUS_TOKEN" ]; then
            curl --fail --silent --show-error --max-time 10 \
              -H "Authorization: Bearer $MAC_RUNNER_STATUS_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
              -o "$RUNNER_TEMP/mac-runners.json" || rm -f "$RUNNER_TEMP/mac-runners.json"
          fi
      - name: Read the workflow queue snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_PATH: ${{ runner.temp }}/mac-queue.json
        run: |
          rm -f "$QUEUE_PATH" "$QUEUE_PATH.tmp"
          trap 'rm -f "$QUEUE_PATH.tmp"' EXIT
          timeout 60s python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ['GITHUB_API_URL'].rstrip('/') + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json'}

          def pages(path, key, params):
              rows = []
              page = 1
              while True:
                  query = urllib.parse.urlencode(dict(params, per_page=100, page=page))
                  request = urllib.request.Request(base + path + '?' + query, headers=headers)
                  with urllib.request.urlopen(request, timeout=10) as response:
                      data = json.load(response)
                  batch = data[key]
                  if not isinstance(batch, list):
                      raise ValueError('Malformed Actions API response')
                  rows.extend(batch)
                  # A short page ends the list. total_count is not used: for
                  # status-filtered runs GitHub reports more than it returns
                  # (run 44107206214), which made every snapshot unavailable.
                  if len(batch) < 100:
                      return rows
                  page += 1

          runs = []
          for status in ('queued', 'in_progress'):
              runs.extend(pages('/runs', 'workflow_runs', {'status': status}))
          counts = {'mac_queued': 0, 'hosted_queued': 0, 'hosted_running': 0}
          seen = set()
          for run in runs:
              run_id = run['id']
              if type(run_id) is not int or run_id <= 0:
                  raise ValueError('Invalid workflow run ID')
              if run_id in seen:
                  continue
              seen.add(run_id)
              for job in pages('/runs/' + str(run_id) + '/jobs', 'jobs', {}):
                  labels, status = job['labels'], job['status']
                  if not isinstance(labels, list) or any(not isinstance(label, str) for label in labels) or not isinstance(status, str):
                      raise ValueError('Malformed workflow job')
                  if 'rui-mac' in labels and status == 'queued':
                      counts['mac_queued'] += 1
                  if 'macos-15' in labels:
                      if status == 'queued':
                          counts['hosted_queued'] += 1
                      elif status == 'in_progress':
                          counts['hosted_running'] += 1
          path = os.environ['QUEUE_PATH']
          with open(path + '.tmp', 'w') as output:
              json.dump(counts, output)
          os.replace(path + '.tmp', path)
          PY
      - name: Choose the Mac runner with hosted fallback
        id: decide
        if: ${{ always() }}
        continue-on-error: true
        env:
          INPUTS: ${{ toJSON(inputs) }}
          RUI_MAC_RUNNER: ${{ vars.RUI_MAC_RUNNER }}
          RUNNERS_PATH: ${{ runner.temp }}/mac-runners.json
          QUEUE_PATH: ${{ runner.temp }}/mac-queue.json
        run: python3 -B tests/ci/mac_runner.py
      - name: Explain an unavailable routing decision
        if: ${{ always() && steps.decide.outcome != 'success' }}
        continue-on-error: true
        run: echo 'Hosted macOS is selected because the routing step was unavailable.' >> "$GITHUB_STEP_SUMMARY"
  plan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      screens_required: ${{ steps.shape.outputs.screens_required }}
      change_kind: ${{ steps.select.outputs.change_kind }}
      draft_run: ${{ steps.select.outputs.draft_run }}
      candidate_ref: ${{ steps.select.outputs.candidate_ref }}
      targets: ${{ steps.select.outputs.targets }}
      linux_compile_targets: ${{ steps.select.outputs.linux_compile_targets }}
      native_targets: ${{ steps.select.outputs.native_targets }}
      native: ${{ steps.select.outputs.native }}
      retry: ${{ steps.select.outputs.retry }}
      quarantine: ${{ steps.select.outputs.quarantine }}
      linux_memory: ${{ steps.select.outputs.linux_memory }}
      cache_execution: ${{ steps.select.outputs.cache_execution }}
      typecheck_macos: ${{ steps.select.outputs.typecheck_macos }}
      linux_matrix: ${{ steps.select.outputs.linux_matrix }}
      linux_split: ${{ steps.select.outputs.linux_split }}
      macos_matrix: ${{ steps.select.outputs.macos_matrix }}
      policy_skips: ${{ steps.select.outputs.policy_skips }}
      pr_job: ${{ steps.select.outputs.pr_job }}
      pr_mysql_migration: ${{ steps.select.outputs.pr_mysql_migration }}
      pr_setup_targets: ${{ steps.select.outputs.pr_setup_targets }}
      compile_only: ${{ steps.select.outputs.compile_only }}
    steps:
      - name: PR admission trigger ${{ github.event.pull_request.number }} ${{ github.event.pull_request.draft && 'draft' || 'ready' }}
        if: ${{ github.event_name == 'pull_request' }}
        run: ':'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Select existing targets
        id: select
        env:
          CANDIDATE_REF: ${{ github.sha }}
          # A PR's base.sha can trail the main its merge commit was built on.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || inputs.base }}
          DRAFT: ${{ github.event.pull_request.draft || false }}
          EVENT_NAME: ${{ github.event_name }}
          PROMOTION: ${{ inputs.promotion || false }}
          COMPILE_ONLY: ${{ inputs.compile_only || false }}
          NATIVE_TARGETS: ${{ inputs.native_targets || '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REF"
          python3 tests/ci/select_tests.py --base "$BASE" --phase review > selection.json
          cat selection.json
          BASE=$(python3 -c 'import json; print(json.load(open("selection.json"))["base"])')
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tests/ci')
          from docs_only import classify
          from ci_plan import plan
          selection = json.load(open('selection.json'))
          kind = classify(selection['base'], selection['head'])
          native = {'native_targets': json.loads(os.environ['NATIVE_TARGETS'])} if os.environ.get('NATIVE_TARGETS') else {}
          result = plan(selection, event_name=os.environ['EVENT_NAME'],
                        draft=os.environ['DRAFT'] == 'true', promotion=os.environ['PROMOTION'] == 'true',
                        change_kind=kind, compile_only=os.environ['COMPILE_ONLY'] == 'true', **native)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('candidate_ref=' + os.environ['CANDIDATE_REF'], file=f)
              for key, value in result.outputs.items():
                  print(key + '=' + (value if isinstance(value, str) else json.dumps(value)), file=f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              print('Selection (not acceptance):\n```json\n' + json.dumps(result.selection, indent=2) + '\n```', file=f)
          PY
      - name: Require PR Shape
        id: shape
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(python3 -c 'import json; print(json.load(open("selection.json"))["base"])')
          python3 tests/ci/pr_shape.py "$BASE"
  policy:
    needs: plan
    # A ready PR runs policy inside its single job.
    if: ${{ !github.event.repository.private && needs.plan.outputs.change_kind == 'normal' && needs.plan.outputs.draft_run == 'false' && needs.plan.outputs.compile_only == 'false' && needs.plan.outputs.pr_job == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Caller-error allowances only shrink from trusted main history.
          fetch-depth: 0
          filter: blob:none
      - name: Install the pinned packages tests/ci imports
        run: python3 -m pip install --disable-pip-version-check -r tests/integration/requirements.txt -r tests/ci/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Cache maintenance publishes this tarball on main, so a GitHub release
      # outage does not fail policy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint
          key: rui-actionlint-1.7.7-linux-amd64
      - name: Install the pinned workflow linter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          bash .github/scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - uses: ./.github/actions/policy
        with:
          skips: ${{ needs.plan.outputs.policy_skips }}
  pr_linux:
    # A ready PR's whole run: one runner sets up once, runs policy, compiles only what its
    # PR-tier targets need and runs them, cheapest first. A policy failure lets compile and
    # tests still report; a compile failure stops the tests; the first failed target stops
    # the rest and names them.
    name: linux pr
    needs: plan
    if: ${{ needs.plan.outputs.pr_job == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
          # Caller-error allowances only shrink from trusted main history.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        id: setup
        with:
          targets: ${{ needs.plan.outputs.pr_setup_targets }}
          # Restore the Linux producer's snapshot that main publishes (linux_build); its
          # C objects and build runner serve this job's one compile of every selected root.
          cache-part: compiled
          # Only main saves caches; this job runs only for pull requests.
          publish-caches: 'false'
      - name: Log the CI host and compiled cache match
        env:
          BUILD_MATCH: ${{ steps.setup.outputs.build-match }}
        run: |
          set -euo pipefail
          cpu=$(grep -m1 -E '^(model name|CPU implementer)' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//' || true)
          echo "CI host: cpu=${cpu:-unknown} compiled-cache=${BUILD_MATCH:-miss}"
      - name: Install the pinned packages tests/ci imports
        run: python3 -m pip install --disable-pip-version-check -r tests/integration/requirements.txt -r tests/ci/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Cache maintenance publishes this tarball on main, so a GitHub release
      # outage does not fail policy.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint
          key: rui-actionlint-1.7.7-linux-amd64
      - name: Install the pinned workflow linter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          bash .github/scripts/install-actionlint.sh "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Check formatting
        id: format
        continue-on-error: true
        run: zig fmt --check --ast-check build.zig build src tests/ci/deep_modules
      # Only a ready PR that changes a Store migration step (ci_plan pr_mysql_migration) starts MySQL 8.4;
      # the steps match the split job's MySQL start, wait and verification in linux_suites.
      - name: Start MySQL 8.4 for the live migration check
        if: ${{ needs.plan.outputs.pr_mysql_migration == 'true' }}
        # In the background, so the pull and initialisation overlap the compile; "Wait for MySQL 8.4" collects the outcome.
        run: |
          set -euo pipefail
          socket_dir="$RUNNER_TEMP/mysql"
          mkdir -p "$socket_dir"
          password=$(openssl rand -hex 16)
          RUI_TEST_MYSQL_ROOT_PASSWORD="$password" nohup python3 -B tests/integration/mysql_server.py \
            start rui-mysql "$socket_dir" "$RUNNER_TEMP/mysql-started" > "$RUNNER_TEMP/mysql-start.log" 2>&1 &
          RUI_TEST_REQUIRE_ENGINES="${RUI_TEST_REQUIRE_ENGINES:+$RUI_TEST_REQUIRE_ENGINES,}sqlite" \
          python3 -B tests/ci/live_engine_step.py export mysql \
            "$socket_dir/mysqld.sock" "$password" "$RUNNER_TEMP/mysql-dialect-check-record"
      # Policy is Python and Node on mostly one core; the compile analyses each binary on one
      # thread. Policy runs beside it at lower priority; this step fails only for the compile,
      # and the job's last step fails for policy, so a policy failure still lets tests run
      # (except a stale Store table, which the compile refuses before its slow comptime path).
      - name: Compile only the binaries the selected targets need
        id: compile
        env:
          TARGETS: ${{ needs.plan.outputs.linux_compile_targets }}
          SKIPS: ${{ needs.plan.outputs.policy_skips }}
        run: |
          bash .github/actions/policy/beside.sh -- bash -euo pipefail -c '
            if [ "$TARGETS" != "[]" ]; then
              python3 -B tests/ci/build_artifact.py compile "$TARGETS"
              zig build --fetch=all
            fi'
      - name: Give tests macOS's temporary directory shape
        if: ${{ needs.plan.outputs.targets != '[]' }}
        uses: ./.github/actions/darwin-tmpdir
      - name: Wait for MySQL 8.4
        if: ${{ needs.plan.outputs.pr_mysql_migration == 'true' }}
        run: |
          python3 -B tests/integration/mysql_server.py wait rui-mysql "$RUNNER_TEMP/mysql-started" \
            || { cat "$RUNNER_TEMP/mysql-start.log"; exit 1; }
      - name: Run selected targets, stopping at the first failure (SQLite; MySQL 8.4 when a migration step changed)
        if: ${{ needs.plan.outputs.targets != '[]' }}
        timeout-minutes: 35
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          QUARANTINE: ${{ needs.plan.outputs.quarantine }}
          RUI_FAILURE_ARTIFACTS: ${{ runner.temp }}/rui-failure-artifacts
        run: |
          set -euo pipefail
          echo "Source SHA $(git rev-parse HEAD); actual native $(uname -s)/$(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -B tests/ci/run_selected.py "$TARGETS" --ci-artifacts .zig-cache/o/ci-compiled --quarantine "$QUARANTINE"
      - name: Require that the live MySQL migration check ran
        # Same proof as linux_suites: fails when the check left no record or prepared nothing.
        if: ${{ !cancelled() && needs.plan.outputs.pr_mysql_migration == 'true' }}
        run: |
          set -euo pipefail
          python3 -B tests/ci/live_engine_step.py verify mysql | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded failed-fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-linux-pr-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
      - name: Fail for the policy or format checks that failed above
        if: ${{ !cancelled() && (steps.compile.outputs.policy != 'success' || steps.format.outcome == 'failure') }}
        env:
          POLICY: ${{ steps.compile.outputs.policy || 'not reported' }}
          FORMAT: ${{ steps.format.outcome }}
        run: |
          echo "::error::Policy checks: $POLICY; format check: $FORMAT. Compile and tests still ran."
          exit 1
  linux_build:
    needs: plan
    if: ${{ needs.plan.outputs.pr_job == 'false' && needs.plan.outputs.linux_compile_targets != '' && needs.plan.outputs.linux_compile_targets != '[]' }}
    runs-on: ubuntu-24.04
    # Match the cold Release producer budget: a dependency repin misses the compiled cache,
    # with a bounded compile step leaving time to save partial work.
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
      - uses: ./.github/actions/setup
        id: setup
        with:
          targets: ${{ needs.plan.outputs.linux_compile_targets }}
          check-part: compiled
          # Diagnostic PR-profile builds must never enter main's LLVM snapshot.
          publish-caches: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.cache_profile) }}
      - name: Record restored Linux cache contents
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_profile }}
        run: |
          mkdir -p "$RUNNER_TEMP/rui-cache-profile"
          du -a -b .zig-cache "$HOME/.cache/zig" zig-pkg screen-emulator/zig-pkg > "$RUNNER_TEMP/rui-cache-profile/before.tsv"
          command -v strace
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          files = [p for root in (pathlib.Path('.zig-cache/h'), pathlib.Path.home() / '.cache/zig/h')
                   for p in sorted(root.glob('*')) if len(p.name) == 32 and p.is_file()]
          empty = [str(p) for p in files if p.stat().st_size == 0]
          pathlib.Path(os.environ['RUNNER_TEMP'], 'rui-cache-profile', 'unfinalized-manifests.json').write_text(json.dumps(empty))
          empty_set = set(empty)
          paths = [str(p) for p in files if str(p) not in empty_set]
          with open(os.environ['RUNNER_TEMP'] + '/rui-cache-profile/manifests.zon', 'w') as out:
              for i in range(0, len(paths), 128):
                  subprocess.run(['zig', 'cache-cat', *paths[i:i+128]], stdout=out, check=True)
          PY
      - name: Compile selected gates once, never test acceptance
        id: compile
        # Cache timing: green 851 s, run 43732653500; minimum margin 120 s.
        # Limit = job budget - cold setup allowance - save reserve.
        timeout-minutes: 32
        env:
          TARGETS: ${{ needs.plan.outputs.linux_compile_targets }}
          PART: ${{ needs.plan.outputs.linux_split == 'true' && 'rest' || 'all' }}
        run: |
          trace=()
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.cache_profile }}" = true ]; then
            trace=(strace -f -qq -yy -s 4096 -e trace=%file -o "$RUNNER_TEMP/rui-cache-profile/access.trace")
          fi
          "${trace[@]}" python3 -B tests/ci/build_artifact.py build "$TARGETS" --part "$PART"
      - name: Compare original and compacted caches with unchanged and edited LLVM and PR producers
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_profile }}
        env:
          TARGETS: ${{ needs.plan.outputs.linux_compile_targets }}
          PART: ${{ needs.plan.outputs.linux_split == 'true' && 'rest' || 'all' }}
        run: |
          python3 -B tests/ci/cache_snapshot_proof.py --targets "$TARGETS" --part "$PART" \
            --protect-prefix "$RUNNER_TEMP/rui-compiled-build/bin" \
            --global-cache "$ZIG_GLOBAL_CACHE_DIR" --zig-lib "$RUNNER_TEMP/rui-zig/lib" --measure-archives
      - name: Record produced Linux cache contents
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.cache_profile }}
        run: du -a -b .zig-cache "$HOME/.cache/zig" zig-pkg screen-emulator/zig-pkg > "$RUNNER_TEMP/rui-cache-profile/after.tsv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.cache_profile }}
        with:
          name: linux-cache-profile-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-cache-profile
          compression-level: 1
          if-no-files-found: error
          retention-days: 3
      - name: Save reusable caches even after failure
        if: ${{ always() }}
        uses: ./.github/actions/setup/caches
        with:
          save-only: 'true'
          setup-outcome: ${{ steps.setup.outcome }}
          work-outcome: ${{ steps.compile.outcome }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish
        with:
          name: compiled-linux-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-compiled
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  linux_build_unit:
    # Unit roots compile in parallel without queueing behind other gates.
    needs: plan
    if: ${{ needs.plan.outputs.linux_split == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
      - uses: ./.github/actions/setup
        id: setup
        with:
          check-part: compiled-unit
      - name: Compile the unit test roots once, never test acceptance
        id: compile
        # Cache timing: green 480 s, run 43819213128; minimum margin 120 s.
        # No measured save window fits; keep the existing job deadline only.
        env:
          TARGETS: ${{ needs.plan.outputs.linux_compile_targets }}
        run: python3 -B tests/ci/build_artifact.py build "$TARGETS" --part unit
      - name: Save reusable caches even after failure
        if: ${{ always() }}
        uses: ./.github/actions/setup/caches
        with:
          save-only: 'true'
          setup-outcome: ${{ steps.setup.outcome }}
          work-outcome: ${{ steps.compile.outcome }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish
        with:
          name: compiled-linux-unit-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-compiled
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  macos_typecheck:
    # Linux predicts Mac only while Mac compiles. Type-check the product and
    # unit tests for Apple Silicon on Linux: no SDK, link or run. Only a
    # change to what it compiles can change its result (TYPECHECK_INPUTS).
    needs: plan
    if: ${{ needs.plan.outputs.typecheck_macos == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
      - uses: ./.github/actions/setup
        id: setup
        with:
          check-part: typecheck-macos
      - run: zig build typecheck-macos --summary failures
        id: compile
        # Cache timing: green 449 s, run 43819213128; minimum margin 120 s.
        # No measured save window fits; keep the existing job deadline only.
      - name: Save reusable caches even after failure
        if: ${{ always() }}
        uses: ./.github/actions/setup/caches
        with:
          save-only: 'true'
          setup-outcome: ${{ steps.setup.outcome }}
          work-outcome: ${{ steps.compile.outcome }}
  macos_build:
    needs: [plan, mac_runner]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.native == 'true' }}
    runs-on: ${{ fromJSON(needs.mac_runner.outputs.runs_on || '"macos-15"') }}
    # One producer compiles every native gate, unit roots included, so its budget covers
    # both former producers (rest, then unit) run back to back.
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
      - uses: ./.github/actions/setup
        id: setup
        with:
          publish-caches: ${{ github.ref == 'refs/heads/main' && needs.mac_runner.outputs.self_hosted != 'true' && 'true' || 'false' }}
          targets: ${{ needs.plan.outputs.native_targets }}
          check-part: compiled
      - name: Compile selected gates once, never test acceptance
        id: compile
        # PROVISIONAL: 1877 s is the sum of the separate rest (1117 s) and unit (760 s)
        # green runs, run 43720387127, until a combined macos_build run is recorded.
        # Cache timing: green 1877 s, run 43720387127; minimum margin 120 s.
        # Limit = job budget - cold setup allowance - save reserve (the former 60 - 28).
        timeout-minutes: 62
        env:
          TARGETS: ${{ needs.plan.outputs.native_targets }}
        run: |
          sysctl hw.ncpu hw.memsize vm.swapusage
          /usr/bin/time -l python3 -B tests/ci/build_artifact.py build "$TARGETS" --part all
          sysctl vm.swapusage
      - name: Save reusable caches even after failure
        if: ${{ always() }}
        uses: ./.github/actions/setup/caches
        with:
          save-only: 'true'
          setup-outcome: ${{ steps.setup.outcome }}
          work-outcome: ${{ steps.compile.outcome }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish
        with:
          name: compiled-macos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-compiled
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  cache_execution:
    # Admission requires Linux when cache policy changes; promotion adds macOS.
    # Run alongside compilation rather than delaying its producers.
    name: cache execution (${{ matrix.runner }})
    needs: plan
    if: ${{ needs.plan.outputs.cache_execution == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.promotion && '["ubuntu-24.04", "macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
      - uses: ./.github/actions/setup
        id: setup
        with:
          targets: '["test-logic"]'
          check-part: cache-execution
      - name: Prove acceptance freshness, diagnostics and independent overlap
        run: python3 -B -m unittest discover -s tests/ci -p native_acceptance_test.py -v
      - name: Prove warm compilation does not cache test acceptance
        id: compile
        # Cache timing: green 351 s, run 42755585733; minimum margin 120 s.
        # No measured save window fits; keep the existing job deadline only.
        run: python3 -B tests/ci/cache_execution.py
      - name: Save reusable caches even after failure
        if: ${{ always() }}
        uses: ./.github/actions/setup/caches
        with:
          save-only: 'true'
          setup-outcome: ${{ steps.setup.outcome }}
          work-outcome: ${{ steps.compile.outcome }}
  linux_suites:
    name: linux suites (${{ matrix.name }})
    needs: [plan, linux_build, linux_build_unit]
    # The unit producer is skipped when no selected target compiles it. A
    # compile-only build stops at its producers.
    if: ${{ !cancelled() && needs.plan.outputs.compile_only == 'false' && needs.plan.outputs.pr_job == 'false' && needs.plan.outputs.targets != '' && needs.plan.outputs.targets != '[]' && needs.linux_build.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.linux_build_unit.result) }}
    runs-on: ubuntu-24.04
    # Ordinary shards take under ten minutes; a local rebuild after a rejected
    # handoff compiles without the producer's cache. A failed promotion shard
    # also names its batch's suspects.
    timeout-minutes: ${{ inputs.promotion && 300 || 35 }}
    strategy:
      # qualification.py packs Selected suites into at most ten shards, so
      # every shard starts at once; beside a long gate the short suites share three.
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.linux_matrix) }}
    env:
      LIVE_MYSQL: ${{ matrix.live_mysql }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
      - uses: ./.github/actions/setup
        id: setup
        with:
          targets: ${{ toJSON(matrix.targets) }}
          compiled: 'true'
      - name: Start MySQL 8.4 for the live dialect and settings-document checks
        if: ${{ env.LIVE_MYSQL == 'true' }}
        # In the background, so the pull and initialisation overlap the
        # restore; "Wait for MySQL 8.4" collects the outcome.
        run: |
          set -euo pipefail
          socket_dir="$RUNNER_TEMP/mysql"
          mkdir -p "$socket_dir"
          password=$(openssl rand -hex 16)
          RUI_TEST_MYSQL_ROOT_PASSWORD="$password" nohup python3 -B tests/integration/mysql_server.py \
            start rui-mysql "$socket_dir" "$RUNNER_TEMP/mysql-started" > "$RUNNER_TEMP/mysql-start.log" 2>&1 &
          RUI_TEST_REQUIRE_ENGINES="${RUI_TEST_REQUIRE_ENGINES:+$RUI_TEST_REQUIRE_ENGINES,}sqlite" \
          python3 -B tests/ci/live_engine_step.py export mysql \
            "$socket_dir/mysqld.sock" "$password" "$RUNNER_TEMP/mysql-dialect-check-record"
      - name: Use the verified producer artifact or compile locally
        id: restore
        # Local fallback rebuild must retain the whole job budget (including promotion).
        env:
          TARGETS: ${{ needs.plan.outputs.linux_compile_targets }}
          ARTIFACT_ID: ${{ needs.linux_build.outputs.artifact }}
          UNIT_ARTIFACT_ID: ${{ needs.linux_build_unit.outputs.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/build_artifact.py restore "$TARGETS" --artifact-id "$ARTIFACT_ID" --artifact-id "$UNIT_ARTIFACT_ID"
      - name: Configure the build runner before acceptance
        id: compile
        # Restore/rebuild can consume the job budget; do not cap this follow-up either.
        run: zig build --fetch=all
      - name: Save reusable caches even after failure
        if: ${{ always() }}
        uses: ./.github/actions/setup/caches
        with:
          save-only: 'true'
          setup-outcome: ${{ steps.setup.outcome == 'success' && steps.restore.outcome == 'success' && 'success' || 'failure' }}
          work-outcome: ${{ steps.compile.outcome }}
      - name: Start Postgres 15 with TLS for test-pg's live rounds
        if: ${{ matrix.live_postgres }}
        run: |
          set -euo pipefail
          certs="$RUNNER_TEMP/pg-certs"
          mkdir -p "$certs"
          openssl req -new -x509 -days 1 -nodes -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1 \
            -keyout "$certs/server.key" -out "$certs/server.crt" 2>/dev/null
          # The image's postgres user (uid 999) must own a 0600 key.
          sudo chown 999:999 "$certs/server.key" && sudo chmod 600 "$certs/server.key"
          password=$(openssl rand -hex 16)
          docker run -d --name rui-pg -p 127.0.0.1:5432:5432 -v "$certs:/certs:ro" \
            -e POSTGRES_PASSWORD="$password" -e POSTGRES_INITDB_ARGS=--encoding=UTF8 \
            postgres:15 -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for _ in $(seq 60); do
            docker exec rui-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rui-pg pg_isready -h 127.0.0.1 -U postgres
          python3 -B tests/ci/live_engine_step.py export postgres 5432 "$password" "$certs/server.crt"
      - name: Give tests macOS's temporary directory shape
        uses: ./.github/actions/darwin-tmpdir
      - name: Wait for MySQL 8.4
        if: ${{ env.LIVE_MYSQL == 'true' }}
        run: |
          python3 -B tests/integration/mysql_server.py wait rui-mysql "$RUNNER_TEMP/mysql-started" \
            || { cat "$RUNNER_TEMP/mysql-start.log"; exit 1; }
      - name: Run selected targets
        timeout-minutes: 35
        env:
          TARGETS: ${{ toJSON(matrix.targets) }}
          CHECK_PART: ${{ matrix.part }}
          RETRY: ${{ needs.plan.outputs.retry == 'true' && '--retry' || '' }}
          QUARANTINE: ${{ needs.plan.outputs.quarantine }}
          RUI_FAILURE_ARTIFACTS: ${{ runner.temp }}/rui-failure-artifacts
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          echo "Source SHA $(git rev-parse HEAD); actual native $(uname -s)/$(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"
          zig fmt --check --ast-check build.zig build src
          python3 -B tests/ci/run_selected.py "$TARGETS" --check-part "$CHECK_PART" --ci-artifacts .zig-cache/o/ci-compiled --quarantine "$QUARANTINE" $RETRY
      - name: Require that the live MySQL dialect check ran
        # Fails when the unit binary left no record or PREPAREd nothing, so
        # any path that keeps the check from running (selection, launcher
        # environment, caching) turns this shard red.
        if: ${{ !cancelled() && matrix.mysql_dialect }}
        run: |
          set -euo pipefail
          python3 -B tests/ci/live_engine_step.py verify mysql | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded failed-fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-linux-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
      - name: Name the promotion suspects of each failed step
        if: ${{ failure() && inputs.promotion }}
        env:
          BASE: ${{ inputs.base }}
          HEAD_SHA: ${{ needs.plan.outputs.candidate_ref }}
        run: python3 -B tests/ci/promotion.py suspects --base "$BASE" --head "$HEAD_SHA"
      - name: Existing Linux measurement-tool checks, not resource qualification
        if: ${{ needs.plan.outputs.linux_memory == 'true' && contains(matrix.targets, 'test-logic') }}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/qualification/linux-memory -v
          cc -shared -fPIC -pthread -Wall -Wextra -Werror tests/qualification/linux-memory/malloc_probe.c -o "$RUNNER_TEMP/rui-malloc-probe.so"
          rm "$RUNNER_TEMP/rui-malloc-probe.so"
  linux:
    needs: [plan, policy, pr_linux, linux_build, linux_build_unit, linux_suites, macos_typecheck]
    # A pull request's admission runs the same aggregate (require_linux_parts.sh) itself.
    if: ${{ always() && !github.event.repository.private && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
          sparse-checkout: tests/ci
          persist-credentials: false
      - name: Require every selected Linux part
        env:
          DRAFT_RUN: ${{ needs.plan.outputs.draft_run }}
          CHANGE_KIND: ${{ needs.plan.outputs.change_kind }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          COMPILE_TARGETS: ${{ needs.plan.outputs.linux_compile_targets }}
          PLAN_RESULT: ${{ needs.plan.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          PR_JOB: ${{ needs.plan.outputs.pr_job }}
          PR_RESULT: ${{ needs.pr_linux.result }}
          BUILD_RESULT: ${{ needs.linux_build.result }}
          UNIT_RESULT: ${{ needs.linux_build_unit.result }}
          SPLIT: ${{ needs.plan.outputs.linux_split }}
          NATIVE_RESULT: ${{ needs.linux_suites.result }}
          TYPECHECK: ${{ needs.plan.outputs.typecheck_macos }}
          TYPECHECK_RESULT: ${{ needs.macos_typecheck.result }}
          COMPILE_ONLY: ${{ needs.plan.outputs.compile_only }}
        run: bash tests/ci/require_linux_parts.sh
      - name: Name each failed job and its cause
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/failure_cause.py explain
  macos_suites:
    name: macos suites (${{ matrix.name }})
    needs: [plan, mac_runner, macos_build]
    if: ${{ !cancelled() && needs.plan.outputs.native == 'true' && needs.macos_build.result == 'success' }}
    runs-on: ${{ fromJSON(needs.mac_runner.outputs.runs_on || '"macos-15"') }}
    # One job runs every native suite back to back (about 22 min, the sum of the three
    # separate suites' times), so its budget covers that sum plus setup and restore.
    timeout-minutes: ${{ inputs.promotion && 300 || 60 }}
    strategy:
      # The plan emits one native row; the matrix stays so the row set is plan-driven.
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
      - uses: ./.github/actions/setup
        id: setup
        with:
          publish-caches: ${{ github.ref == 'refs/heads/main' && needs.mac_runner.outputs.self_hosted != 'true' && 'true' || 'false' }}
          targets: ${{ toJSON(matrix.targets) }}
          compiled: 'true'
      - name: Use the verified producer artifact or compile locally
        id: restore
        # Local fallback rebuild must retain the whole job budget (including promotion).
        env:
          TARGETS: ${{ needs.plan.outputs.native_targets }}
          ARTIFACT_ID: ${{ needs.macos_build.outputs.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/build_artifact.py restore "$TARGETS" --artifact-id "$ARTIFACT_ID"
      - name: Configure the build runner before acceptance
        id: compile
        # Restore/rebuild can consume the job budget; do not cap this follow-up either.
        run: zig build --fetch=all
      - name: Save reusable caches even after failure
        if: ${{ always() }}
        uses: ./.github/actions/setup/caches
        with:
          save-only: 'true'
          setup-outcome: ${{ steps.setup.outcome == 'success' && steps.restore.outcome == 'success' && 'success' || 'failure' }}
          work-outcome: ${{ steps.compile.outcome }}
      - name: Run required native targets
        timeout-minutes: 45
        env:
          TARGETS: ${{ toJSON(matrix.targets) }}
          CHECK_PART: ${{ matrix.part }}
          RETRY: ${{ needs.plan.outputs.retry == 'true' && '--retry' || '' }}
          QUARANTINE: ${{ needs.plan.outputs.quarantine }}
          RUI_FAILURE_ARTIFACTS: ${{ runner.temp }}/rui-failure-artifacts
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          echo "Native execution CPUs: $(sysctl -n hw.logicalcpu); memory bytes: $(sysctl -n hw.memsize)"
          echo "Source SHA $(git rev-parse HEAD); actual native $(uname -s)/$(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -B tests/ci/run_selected.py "$TARGETS" --check-part "$CHECK_PART" --ci-artifacts .zig-cache/o/ci-compiled --quarantine "$QUARANTINE" $RETRY
      - name: Retain bounded failed-fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-macos-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
      - name: Name the promotion suspects of each failed step
        if: ${{ failure() && inputs.promotion }}
        env:
          BASE: ${{ inputs.base }}
          HEAD_SHA: ${{ needs.plan.outputs.candidate_ref }}
        run: python3 -B tests/ci/promotion.py suspects --base "$BASE" --head "$HEAD_SHA"
  macos:
    # Keep the existing required status. A failed/cancelled matrix member must
    # fail this aggregate, even when its sibling completes successfully.
    needs: [plan, macos_build, macos_suites]
    if: ${{ always() && (needs.plan.outputs.native == 'true' || needs.plan.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected Apple Silicon part
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.macos_build.result }}
          NATIVE_RESULT: ${{ needs.macos_suites.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ failure() }}
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
          sparse-checkout: tests/ci
          persist-credentials: false
      - name: Name each failed job and its cause
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/failure_cause.py explain
  admission:
    # This is the sole PR admission status. Reduced draft feedback cannot pass it.
    # It checks the Linux parts itself (require_linux_parts.sh); the linux job does so off pull requests.
    needs: [plan, policy, macos, cache_execution, pr_linux, linux_build, linux_build_unit, linux_suites, macos_typecheck]
    # A superseded run is cancelled; its admission would only post a red check over a head
    # SHA the newer run is still judging, so it is cancelled with the run instead.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_ref }}
          # The wire check reads origin/main and every v0 tag when this job starts; the
          # recheck reruns this job alone after a release is published.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tests/ci
            openapi.json
            src/wire_version.zig
            src/protocol.zig
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Require the wire contract against the newest release
        run: |
          set -euo pipefail
          # Each missing input fails here; the tests alone would skip and pass.
          git rev-parse --verify -q origin/main >/dev/null || {
            echo '::error::origin/main is missing, so the wire check has no merge base.'; exit 1; }
          git tag --list 'v0.*' > "$RUNNER_TEMP/tags"
          grep -qE '^v0\.[0-9]+\.[0-9]+$' "$RUNNER_TEMP/tags" || {
            echo '::error::No v0 release tag is fetched, so the wire check has no release to compare.'; exit 1; }
          cd tests/ci
          python3 -B -m unittest -v \
            test_wire_version.WireVersionTest.test_wire_contract_changes_bump_wire_version \
            test_wire_version.WireVersionTest.test_wire_version_moves_once_per_release > "$RUNNER_TEMP/wire-version.log" 2>&1 || {
            cat "$RUNNER_TEMP/wire-version.log"; exit 1; }
          cat "$RUNNER_TEMP/wire-version.log"
          if grep -q skipped "$RUNNER_TEMP/wire-version.log"; then
            echo '::error::A wire-version test skipped, so the wire contract was not compared.'; exit 1
          fi
      - name: Require screen evidence
        if: ${{ needs.plan.outputs.screens_required == 'true' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/ci/pr_shape.py --screens
      - name: Require candidate acceptance
        env:
          CHANGE_KIND: ${{ needs.plan.outputs.change_kind }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          NATIVE_TARGETS: ${{ needs.plan.outputs.native_targets }}
          LINUX_MATRIX: ${{ needs.plan.outputs.linux_matrix }}
          MACOS_MATRIX: ${{ needs.plan.outputs.macos_matrix }}
          LINUX_SPLIT: ${{ needs.plan.outputs.linux_split }}
          LINUX_MEMORY: ${{ needs.plan.outputs.linux_memory }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PLAN_RESULT: ${{ needs.plan.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          PR_JOB: ${{ needs.plan.outputs.pr_job }}
          MACOS_RESULT: ${{ needs.macos.result }}
          NATIVE: ${{ needs.plan.outputs.native }}
          CACHE_SELECTED: ${{ needs.plan.outputs.cache_execution }}
          CACHE_RESULT: ${{ needs.cache_execution.result }}
        run: |
          set -euo pipefail
          if [ "$DRAFT" != false ]; then echo '::error::A draft never admits: mark the PR ready for review.'; exit 1; fi
          test "$PLAN_RESULT" = success
          case "$CHANGE_KIND" in
            documentation)
              test "$POLICY_RESULT" = skipped
              test "$NATIVE" = false
              test "$MACOS_RESULT" = skipped
              test "$CACHE_SELECTED" = false
              test "$TARGETS" = '[]'
              test "$NATIVE_TARGETS" = '[]'
              test "$LINUX_MATRIX" = '{"include": []}'
              test "$MACOS_MATRIX" = '{"include": []}'
              test "$LINUX_SPLIT" = false
              test "$LINUX_MEMORY" = false ;;
            normal)
              # The single PR job runs policy itself; admission requires that job.
              case "$PR_JOB" in
                true) test "$POLICY_RESULT" = skipped ;;
                false) test "$POLICY_RESULT" = success ;;
                *) echo 'Missing or invalid PR job selection' >&2; exit 1 ;;
              esac
              # The PR tier runs no macOS; promotion runs it with the upgrade.
              case "$NATIVE" in
                true) test "$MACOS_RESULT" = success ;;
                false) test "$MACOS_RESULT" = skipped ;;
                *) echo 'Missing or invalid native selection' >&2; exit 1 ;;
              esac ;;
            *) echo 'Missing or invalid change kind' >&2; exit 1 ;;
          esac
          case "$CACHE_SELECTED" in
            true) test "$CACHE_RESULT" = success ;;
            false) test "$CACHE_RESULT" = skipped ;;
            *) echo 'Missing or invalid cache selection' >&2; exit 1 ;;
          esac
      - name: Require every selected Linux part
        if: ${{ !cancelled() }}
        env:
          DRAFT_RUN: ${{ needs.plan.outputs.draft_run }}
          CHANGE_KIND: ${{ needs.plan.outputs.change_kind }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          COMPILE_TARGETS: ${{ needs.plan.outputs.linux_compile_targets }}
          PLAN_RESULT: ${{ needs.plan.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          PR_JOB: ${{ needs.plan.outputs.pr_job }}
          PR_RESULT: ${{ needs.pr_linux.result }}
          BUILD_RESULT: ${{ needs.linux_build.result }}
          UNIT_RESULT: ${{ needs.linux_build_unit.result }}
          SPLIT: ${{ needs.plan.outputs.linux_split }}
          NATIVE_RESULT: ${{ needs.linux_suites.result }}
          TYPECHECK: ${{ needs.plan.outputs.typecheck_macos }}
          TYPECHECK_RESULT: ${{ needs.macos_typecheck.result }}
          COMPILE_ONLY: ${{ needs.plan.outputs.compile_only }}
        run: bash tests/ci/require_linux_parts.sh
      - name: Name each failed job and its cause
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/failure_cause.py explain
