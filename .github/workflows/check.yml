name: Check

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - labeled
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'run-ci'
    name: Zig 0.16.0 on macOS ARM64
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Verify Zig version
        run: test "$(zig version)" = "0.16.0"

      - name: Prepare Zig cache
        run: mkdir -p .zig-cache/tmp

      - name: Fetch dependencies
        run: zig build --fetch=all

      - name: Check source and artifacts
        run: zig build check --summary all

      - name: Check disposable workflow evaluator
        run: zig build workflow-check --summary all

      - name: Check repository whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD --
