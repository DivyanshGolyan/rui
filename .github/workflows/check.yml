name: Selected checks
on:
  push:
    branches-ignore: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: selected-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      native_targets: ${{ steps.select.outputs.native_targets }}
      native: ${{ steps.select.outputs.native }}
      linux_memory: ${{ steps.select.outputs.linux_memory }}
      cache_execution: ${{ steps.select.outputs.cache_execution }}
    steps:
      - name: Avoid duplicate development work for a ready PR
        id: cadence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            let run = true;
            if (context.eventName === 'push') {
              try {
                const branch = context.ref.replace(/^refs\/heads\//, '');
                const pulls = await github.paginate(github.rest.pulls.list, {
                  ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}`
                });
                const ready = pulls.find(p => !p.draft && p.head.sha === context.sha &&
                  p.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`);
                if (ready) {
                  const {data} = await github.rest.pulls.get({...context.repo, pull_number: ready.number});
                  // Conflicted or unknown mergeability keeps development fallback.
                  run = data.head.sha !== context.sha || data.mergeable !== true;
                }
              } catch {
                core.warning('PR lookup unavailable; running development checks.');
              }
            }
            core.setOutput('run', String(run));
            if (!run) await core.summary.addRaw(
              `Duplicate development work omitted for ready, mergeable head ${context.sha}. Fresh merge-ref review remains required.`
            ).write();
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ steps.cadence.outputs.run == 'true' }}
        with:
          fetch-depth: 0
      - name: Select existing targets
        if: ${{ steps.cadence.outputs.run == 'true' }}
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PHASE: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && 'review' || 'development' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          fallback=()
          if [ "$EVENT_NAME" = push ]; then
            fallback=(--fallback-base origin/main)
          fi
          python3 tests/ci/select_tests.py --base "$BASE" --phase "$PHASE" "${fallback[@]}" > selection.json
          cat selection.json
          BASE=$(python3 -c 'import json; print(json.load(open("selection.json"))["base"])')
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          import json, os
          p = json.load(open('selection.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('targets=' + json.dumps(p['targets']), file=f)
              print('native_targets=' + json.dumps(p['native_targets']), file=f)
              print('native=' + str(p['native_required']).lower(), file=f)
              print('linux_memory=' + str(p['linux_memory_checks']).lower(), file=f)
              print('cache_execution=' + str(p['cache_execution_checks']).lower(), file=f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              print('Selection (not acceptance):\n```json\n' + json.dumps(p, indent=2) + '\n```', file=f)
          PY
      - run: python3 -B -m unittest discover -s tests/ci -v
        if: ${{ steps.cadence.outputs.run == 'true' }}
      - name: Install the pinned workflow linter
        if: ${{ steps.cadence.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          # The official release avoids rebuilding the Go CLI on every plan.
          curl --fail --location --show-error --connect-timeout 10 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint -shellcheck= .github/workflows/check.yml .github/workflows/daily-macos.yml
        if: ${{ steps.cadence.outputs.run == 'true' }}
  linux_suites:
    name: linux suites (${{ matrix.part }})
    needs: plan
    if: ${{ needs.plan.outputs.targets != '' && needs.plan.outputs.targets != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # The serial full gate is the measured critical path on both platforms.
      # Keep ordinary selections single-worker and full-gate parts isolated.
      fail-fast: false
      matrix:
        part: ${{ contains(fromJSON(needs.plan.outputs.targets || '[]'), 'check-full') && fromJSON('["execution", "callers"]') || fromJSON('["all"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.part == 'execution' && '["check-full"]' || needs.plan.outputs.targets }}
          check-part: ${{ matrix.part }}
      - name: Run selected targets without acceptance-result caching
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          CHECK_PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          echo "Tested SHA $(git rev-parse HEAD); actual native $(uname -s)/$(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"
          zig fmt --check --ast-check build.zig src
          python3 -B tests/ci/run_selected.py "$TARGETS" --check-part "$CHECK_PART"
      - name: Prove warm compilation does not cache test acceptance
        if: ${{ needs.plan.outputs.cache_execution == 'true' && matrix.part != 'execution' }}
        run: python3 -B tests/ci/cache_execution.py
      - name: Existing Linux measurement-tool checks, not resource qualification
        if: ${{ needs.plan.outputs.linux_memory == 'true' && matrix.part != 'execution' }}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/qualification/linux-memory -v
          cc -shared -fPIC -pthread -Wall -Wextra -Werror tests/qualification/linux-memory/malloc_probe.c -o "$RUNNER_TEMP/rui-malloc-probe.so"
          rm "$RUNNER_TEMP/rui-malloc-probe.so"
  linux:
    # Preserve the existing required status for the entire selected Linux gate.
    needs: [plan, linux_suites]
    if: ${{ always() && ((needs.plan.outputs.targets != '' && needs.plan.outputs.targets != '[]') || needs.plan.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected Linux part
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          NATIVE_RESULT: ${{ needs.linux_suites.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$NATIVE_RESULT" = success
  macos_suites:
    name: macos suites (${{ matrix.part }})
    needs: plan
    if: ${{ needs.plan.outputs.native == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      # Only the measured serial full gate gets two isolated machines. Ordinary
      # affected targets and the changed-main backstop keep their existing cadence.
      fail-fast: false
      matrix:
        part: ${{ contains(fromJSON(needs.plan.outputs.native_targets || '[]'), 'check-full') && fromJSON('["execution", "callers"]') || fromJSON('["all"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.part == 'execution' && '["check-full"]' || needs.plan.outputs.native_targets }}
          check-part: ${{ matrix.part }}
      - name: Run required native targets
        env:
          TARGETS: ${{ needs.plan.outputs.native_targets }}
          CHECK_PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          echo "Tested SHA $(git rev-parse HEAD); actual native $(uname -s)/$(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -B tests/ci/run_selected.py "$TARGETS" --check-part "$CHECK_PART"
      - name: Prove warm compilation does not cache test acceptance
        if: ${{ needs.plan.outputs.cache_execution == 'true' && matrix.part != 'execution' }}
        run: python3 -B tests/ci/cache_execution.py
  macos:
    # Keep the existing required status. A failed/cancelled matrix member must
    # fail this aggregate, even when its sibling completes successfully.
    needs: [plan, macos_suites]
    if: ${{ always() && (needs.plan.outputs.native == 'true' || needs.plan.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected Apple Silicon part
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          NATIVE_RESULT: ${{ needs.macos_suites.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$NATIVE_RESULT" = success
