name: Selected checks
# Auto-land reads dispatch titles to distinguish main landing from stable qualification.
run-name: ${{ inputs.stable && format('Stable qualification from base {0}', inputs.base) || github.event_name == 'workflow_dispatch' && format('Selected checks from base {0}', inputs.base) || '' }}
on:
  push:
    branches: ['wip/land-*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Qualify a landing tip again, or against an older base such as a combined
  # stack whose constituent already reached main. Auto-land accepts it only
  # when main contains the base.
  workflow_dispatch:
    inputs:
      base:
        description: Base commit; selection covers base..ref
        required: true
      stable:
        description: Qualify current main on Mac, including candidates with no selected native targets
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: selected-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ inputs.stable && github.sha || '' }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      native_targets: ${{ steps.select.outputs.native_targets }}
      native: ${{ steps.select.outputs.native }}
      retry: ${{ steps.select.outputs.retry }}
      linux_memory: ${{ steps.select.outputs.linux_memory }}
      cache_execution: ${{ steps.select.outputs.cache_execution }}
      linux_matrix: ${{ steps.select.outputs.linux_matrix }}
      macos_matrix: ${{ steps.select.outputs.macos_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse a second open landing stack before native jobs start
        if: ${{ github.event_name != 'pull_request' && github.ref_name != 'main' }}
        run: python3 -B tests/ci/auto_land.py --preflight "$GITHUB_REF_NAME"
      - name: Select existing targets
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          # Pushes use the same affected-owner mapping, not an unconditional full run.
          PHASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'development' || 'review' }}
          EVENT_NAME: ${{ github.event_name }}
          STABLE: ${{ inputs.stable || false }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            # A landing tip must cover its complete delta against main.
            BASE=$(git merge-base HEAD origin/main)
          fi
          python3 tests/ci/select_tests.py --base "$BASE" --phase "$PHASE" > selection.json
          cat selection.json
          BASE=$(python3 -c 'import json; print(json.load(open("selection.json"))["base"])')
          git diff --check "$BASE" HEAD
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tests/ci')
          from qualification import shards
          from select_tests import CHECK_COVERS
          p = json.load(open('selection.json'))
          if os.environ['STABLE'] == 'true':
              assert os.environ['GITHUB_REF_NAME'] == 'main', 'stable qualifies main only'
              p['targets'] = []
              p['native_targets'] = sorted((set(p['native_targets']) - CHECK_COVERS)
                                           | {'check', 'admission-debug-integration'})
              p['retry'] = False
          elif os.environ['EVENT_NAME'] != 'pull_request':
              # Landing is Linux-only, even for strict paths. Mac runs after main.
              p['native_targets'] = []
          p['native_required'] = bool(p['native_targets'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('targets=' + json.dumps(p['targets']), file=f)
              print('native_targets=' + json.dumps(p['native_targets']), file=f)
              print('linux_matrix=' + json.dumps(shards(p['targets'])), file=f)
              print('macos_matrix=' + json.dumps(shards(p['native_targets'], 'macos')), file=f)
              print('native=' + str(p['native_required']).lower(), file=f)
              print('retry=' + str(p['retry']).lower(), file=f)
              print('linux_memory=' + str(p['linux_memory_checks']).lower(), file=f)
              print('cache_execution=' + str(p['cache_execution_checks']).lower(), file=f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              print('Selection (not acceptance):\n```json\n' + json.dumps(p, indent=2) + '\n```', file=f)
          PY
  policy:
    # Lint/test policy alongside selection; it must not delay native allocation.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Import-cycle allowances may only shrink from trusted main history.
          fetch-depth: 0
      - run: python3 -B -m unittest discover -s tests/ci -v
      - name: Reject undefined fixture names before native builds
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.17.0
          python3 -m ruff check --select F821 tests
      - name: Install the pinned workflow linter
        run: |
          set -euo pipefail
          # The official release avoids rebuilding the Go CLI on every plan.
          curl --fail --location --show-error --connect-timeout 10 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate workflows with one pinned-linter compatibility exception
        run: |
          set -euo pipefail
          for workflow in .github/workflows/*.yml; do
            if [ "$workflow" = .github/workflows/qualify-macos.yml ] || [ "$workflow" = .github/workflows/previous-release-upgrade.yml ] || [ "$workflow" = .github/workflows/release.yml ]; then
              # 1.7.7 predates GitHub's server-enforced cache policy key.
              actionlint -shellcheck= -ignore '^unexpected key "cache-mode" for "workflow" section\.' "$workflow"
            else
              actionlint -shellcheck= "$workflow"
            fi
          done
  linux_build:
    needs: plan
    if: ${{ needs.plan.outputs.targets != '' && needs.plan.outputs.targets != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          targets: ${{ needs.plan.outputs.targets }}
          check-part: compiled
      - name: Compile selected gates once, never test acceptance
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: python3 -B tests/ci/build_artifact.py build "$TARGETS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish
        with:
          name: compiled-linux-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-compiled
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  macos_build:
    needs: plan
    if: ${{ needs.plan.outputs.native == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          targets: ${{ needs.plan.outputs.native_targets }}
          check-part: compiled
      - name: Compile selected gates once, never test acceptance
        env:
          TARGETS: ${{ needs.plan.outputs.native_targets }}
        run: python3 -B tests/ci/build_artifact.py build "$TARGETS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: publish
        with:
          name: compiled-macos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-compiled
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  cache_execution:
    # Not required by linux or macos: the cache-policy proof runs beside the
    # gates instead of delaying both producers.
    name: cache execution (${{ matrix.runner }})
    needs: plan
    if: ${{ needs.plan.outputs.cache_execution == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ inputs.stable && fromJSON('["macos-15"]') || github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04", "macos-15"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          targets: '["test-logic"]'
          check-part: cache-execution
      - name: Prove warm compilation does not cache test acceptance
        run: python3 -B tests/ci/cache_execution.py
  linux_suites:
    name: linux suites (${{ matrix.name }})
    needs: [plan, linux_build]
    if: ${{ needs.plan.outputs.targets != '' && needs.plan.outputs.targets != '[]' }}
    runs-on: ubuntu-24.04
    # Ordinary shards take under ten minutes; a local rebuild after a rejected
    # handoff compiles without the producer's cache.
    timeout-minutes: 35
    strategy:
      # qualification.py packs Selected suites into at most ten shards, so
      # every shard starts at once.
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          targets: ${{ needs.plan.outputs.targets }}
          compiled: 'true'
      - name: Use the verified producer artifact or compile locally
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          ARTIFACT_ID: ${{ needs.linux_build.outputs.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/build_artifact.py restore "$TARGETS" --artifact-id "$ARTIFACT_ID"
      - name: Run selected targets
        env:
          TARGETS: ${{ toJSON(matrix.targets) }}
          CHECK_PART: ${{ matrix.part }}
          RETRY: ${{ needs.plan.outputs.retry == 'true' && '--retry' || '' }}
          RUI_FAILURE_ARTIFACTS: ${{ runner.temp }}/rui-failure-artifacts
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          echo "Source SHA $(git rev-parse HEAD); actual native $(uname -s)/$(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"
          zig fmt --check --ast-check build.zig src
          python3 -B tests/ci/run_selected.py "$TARGETS" --check-part "$CHECK_PART" --ci-artifacts .zig-cache/o/ci-compiled $RETRY
      - name: Retain bounded failed-fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-linux-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
      - name: Existing Linux measurement-tool checks, not resource qualification
        if: ${{ needs.plan.outputs.linux_memory == 'true' && contains(matrix.targets, 'test-logic') }}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/qualification/linux-memory -v
          cc -shared -fPIC -pthread -Wall -Wextra -Werror tests/qualification/linux-memory/malloc_probe.c -o "$RUNNER_TEMP/rui-malloc-probe.so"
          rm "$RUNNER_TEMP/rui-malloc-probe.so"
  linux:
    # Policy is required even for documentation-only changes.
    needs: [plan, policy, linux_build, linux_suites]
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected Linux part
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
          PLAN_RESULT: ${{ needs.plan.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          BUILD_RESULT: ${{ needs.linux_build.result }}
          NATIVE_RESULT: ${{ needs.linux_suites.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$POLICY_RESULT" = success
          if [ -n "$TARGETS" ] && [ "$TARGETS" != '[]' ]; then
            test "$BUILD_RESULT" = success
            test "$NATIVE_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
            test "$NATIVE_RESULT" = skipped
          fi
  macos_suites:
    name: macos suites (${{ matrix.name }})
    needs: [plan, macos_build]
    if: ${{ needs.plan.outputs.native == 'true' }}
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      # Start alongside Linux; bound Mac occupancy while keeping suites isolated.
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          targets: ${{ needs.plan.outputs.native_targets }}
          compiled: 'true'
      - name: Use the verified producer artifact or compile locally
        env:
          TARGETS: ${{ needs.plan.outputs.native_targets }}
          ARTIFACT_ID: ${{ needs.macos_build.outputs.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/build_artifact.py restore "$TARGETS" --artifact-id "$ARTIFACT_ID"
      - name: Run required native targets
        env:
          TARGETS: ${{ toJSON(matrix.targets) }}
          CHECK_PART: ${{ matrix.part }}
          RETRY: ${{ needs.plan.outputs.retry == 'true' && '--retry' || '' }}
          RUI_FAILURE_ARTIFACTS: ${{ runner.temp }}/rui-failure-artifacts
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          echo "Source SHA $(git rev-parse HEAD); actual native $(uname -s)/$(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 -B tests/ci/run_selected.py "$TARGETS" --check-part "$CHECK_PART" --ci-artifacts .zig-cache/o/ci-compiled $RETRY
      - name: Retain bounded failed-fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-macos-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rui-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
  macos:
    # Keep the existing required status. A failed/cancelled matrix member must
    # fail this aggregate, even when its sibling completes successfully.
    needs: [plan, macos_build, macos_suites]
    if: ${{ always() && (needs.plan.outputs.native == 'true' || needs.plan.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected Apple Silicon part
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.macos_build.result }}
          NATIVE_RESULT: ${{ needs.macos_suites.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
  completion:
    # Explicit dispatch is supported for GITHUB_TOKEN; workflow_run is suppressed.
    needs: [linux, macos, cache_execution]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stable && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Wake Auto-land after this qualification finishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-land.yml --repo "$GITHUB_REPOSITORY" --ref main -f completed_run="$GITHUB_RUN_ID"
