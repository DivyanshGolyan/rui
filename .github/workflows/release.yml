name: Release
# Only a green promotion (promote.yml) calls this, with the main SHA it qualified.
# Recover a failed publication by rerunning that promotion's failed jobs.
on:
  workflow_call:
    inputs:
      sha:
        description: Qualified main commit SHA (not a branch or PR ref)
        type: string
        required: true

permissions:
  contents: read

# Released bytes come from cold builds; the release publishes no caches.
cache-mode: read

concurrency:
  # Serialize numbering and publication.
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Draft reservations are visible only with push access. This job never writes.
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          python3 -B tests/ci/release.py plan "$SHA" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: ${{ needs.plan.outputs.version != '' }}
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # Portable targets: baseline CPUs and the oldest libc each build links.
          # host_launch.c needs closefrom from glibc 2.34; Zig's macOS minimum is 15.
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-linux-gnu.2.34
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-linux-gnu.2.34
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          publish-caches: 'false'
          # Released bytes never come from shared build caches.
          cold: 'true'
      - name: Build and check the tagged release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # build.zig reads the version from this local tag.
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "v$VERSION^{commit}")" = "$SHA"
          else
            git tag "v$VERSION" "$SHA"
          fi
          name="rui-$VERSION-$PLATFORM"
          zig build -Doptimize=ReleaseSafe "-Dtarget=$TARGET" --prefix "$RUNNER_TEMP/$name" --summary all
          mkdir dist
          if [ "$(uname -s)" = Linux ]; then
            # Debug info is most of a Linux executable, so it ships as a separate archive.
            # Extracted beside the executable, Zig crash traces find it through .gnu_debuglink.
            mkdir -p "$RUNNER_TEMP/debug/$name/bin"
            debug_file="$RUNNER_TEMP/debug/$name/bin/rui.debug"
            objcopy --only-keep-debug "$RUNNER_TEMP/$name/bin/rui" "$debug_file"
            objcopy --strip-all "--add-gnu-debuglink=$debug_file" "$RUNNER_TEMP/$name/bin/rui"
            tar -czf "dist/$name-debug.tar.gz" -C "$RUNNER_TEMP/debug" "$name"
          fi
          test "$("$RUNNER_TEMP/$name/bin/rui" --version)" = "rui $VERSION ($SHA)"
          if [ "$(uname -s)" = Darwin ]; then otool -L "$RUNNER_TEMP/$name/bin/rui"; else ldd "$RUNNER_TEMP/$name/bin/rui"; fi
          COPYFILE_DISABLE=1 tar -czf "dist/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rui-${{ matrix.platform }}
          path: dist/*.tar.gz
          retention-days: 3
          if-no-files-found: error
  npm:
    # The npm tarballs: the compiled client (npm name ruicode) and one package per platform. npm_publish publishes them.
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Pack the tarballs from the built executables
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          for delay in 10 30 ''; do
            rm -rf "$RUNNER_TEMP/artifacts"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'rui-*' --dir "$RUNNER_TEMP/artifacts" && break
            test -n "$delay" || exit 1
            echo "::warning::Artifact download failed; retrying in ${delay}s"
            sleep "$delay"
          done
          executables=()
          for platform in linux-x86_64 linux-arm64 darwin-arm64; do
            name="rui-$VERSION-$platform"
            mkdir -p "$RUNNER_TEMP/unpacked"
            tar -xzf "$(find "$RUNNER_TEMP/artifacts" -name "$name.tar.gz")" -C "$RUNNER_TEMP/unpacked"
            executables+=("$platform=$RUNNER_TEMP/unpacked/$name/bin/rui")
          done
          cd clients/ts
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/pack.mjs "$VERSION" "$RUNNER_TEMP/npm" "${executables[@]}"
          ls -l "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rui-npm
          path: ${{ runner.temp }}/npm/*.tgz
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: [plan, build, npm]
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' &&
          (needs.build.result == 'success' || needs.build.result == 'skipped') &&
          (needs.npm.result == 'success' || needs.npm.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # Ten for publication, seven for fetching and measuring Host memory.
    timeout-minutes: 17
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Repair the compatibility pointer for an already published release
        if: ${{ needs.plan.outputs.version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: python3 -B tests/ci/release.py repair "$SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.plan.outputs.version != '' }}
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: .release-source
          persist-credentials: false
      - name: Fetch the released Linux executable to measure
        id: memory_fetch
        if: ${{ needs.plan.outputs.version != '' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rui-linux-x86_64 --dir "$RUNNER_TEMP/memory"
      - name: Measure the released Linux executable's Host memory
        # Never holds back the release: the notes say "not measured" when this step does not finish.
        # No token here: this step installs packages and runs fixture and product code.
        if: ${{ needs.plan.outputs.version != '' && steps.memory_fetch.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/memory/rui-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/memory"
          python3 -m venv "$RUNNER_TEMP/memory-python"
          "$RUNNER_TEMP/memory-python/bin/pip" --disable-pip-version-check install --retries 1 \
            -r .release-source/tests/integration/requirements.txt
          "$RUNNER_TEMP/memory-python/bin/python" -B .release-source/tests/ci/host_memory.py \
            "$RUNNER_TEMP/memory/rui-$VERSION-linux-x86_64/bin/rui" > "$RUNNER_TEMP/host-memory.md"
      - name: Resume and publish archives, digests and installer
        if: ${{ needs.plan.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          for delay in 10 30 ''; do
            rm -rf "$RUNNER_TEMP/artifacts"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'rui-*' --dir "$RUNNER_TEMP/artifacts" && break
            test -n "$delay" || exit 1
            echo "::warning::Artifact download failed; retrying in ${delay}s"
            sleep "$delay"
          done
          mkdir dist
          find "$RUNNER_TEMP/artifacts" -name "rui-$VERSION-*.tar.gz" -exec mv {} dist/ \;
          find "$RUNNER_TEMP/artifacts" -name "rui-*$VERSION.tgz" -exec mv {} dist/ \;
          (cd dist && sha256sum rui-*.tar.gz rui-*.tgz > SHA256SUMS && cat SHA256SUMS)
          python3 -B tests/ci/release.py installer "$VERSION" dist/SHA256SUMS dist/install.sh --source-root .release-source
          schema=$(echo "$VERSION" | cut -d . -f 2)
          {
            echo "Rui $VERSION from main commit $SHA (Store schema $schema)."
            echo
            echo "Install or update on macOS Apple Silicon or Linux x86-64:"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh"
            echo '```'
            echo
            echo "The target build checks Store compatibility at Host startup. Supported SQLite formats are backed up and migrated then; installation alone never migrates or resets a Store. MySQL schema changes remain operator-owned."
            echo
            echo "Also attached: the Linux ARM64 archive, and the npm tarballs (the TypeScript client and one executable package per platform). The same packages are on npm: npm install ruicode."
            echo
            echo "The Linux executables ship without debug info. For readable crash traces, add it"
            echo "to the installed build (again after each update, which installs a new build):"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/rui-$VERSION-linux-x86_64-debug.tar.gz |"
            echo "  tar -xz --strip-components=1 -C \"\$(dirname \"\$(dirname \"\$(readlink -f ~/.local/bin/rui)\")\")\""
            echo '```'
            echo
            if [ -s "$RUNNER_TEMP/host-memory.md" ]; then
              cat "$RUNNER_TEMP/host-memory.md"
            else
              printf '### Host memory\n\nNot measured: the measuring step did not finish; its log in this release run says why.\n'
            fi
          } > notes.md
          python3 -B tests/ci/release.py publish "$VERSION" "$SHA" dist notes.md
  recheck_wire_prs:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.version != '' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    # The script owns a shared 90-minute deadline, including API calls. Leave
    # checkout slack so its named timeout reaches the log before job teardown.
    timeout-minutes: 95
    permissions:
      actions: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          # Trusted workflow code, never an open PR's head.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck wire-changing PRs against the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/recheck_wire_prs.py
  npm_publish:
    # Publishes the npm tarballs after the GitHub release; scripts/publish.mjs reads their manifests
    # and orders dependencies first. npm trusted publishing (OIDC) authenticates it: each package
    # trusts this repository's promote.yml, the workflow that calls this one. No token is stored.
    # A rerun skips versions npm already has.
    needs: [plan, npm, publish]
    if: ${{ needs.plan.outputs.version != '' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm install -g npm@11.15.0 --no-audit --no-fund
          for delay in 10 30 ''; do
            rm -rf "$RUNNER_TEMP/npm"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rui-npm --dir "$RUNNER_TEMP/npm" && break
            test -n "$delay" || exit 1
            echo "::warning::Artifact download failed; retrying in ${delay}s"
            sleep "$delay"
          done
          node clients/ts/scripts/publish.mjs "$RUNNER_TEMP/npm"
