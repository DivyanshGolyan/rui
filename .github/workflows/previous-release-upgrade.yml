name: Previous installed-release upgrade
# Internal candidate acceptance, also available for manual diagnosis.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate-ref:
        description: Immutable tested source commit, not a mutable PR ref
        required: true
        type: string
      batch-base:
        description: Last promoted commit; a promotion's failure bisects base..candidate
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Restore shared compilation inputs without competing with the selected suites.
cache-mode: read

concurrency:
  group: previous-release-upgrade-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  upgrade:
    if: ${{ !github.event.repository.private }}
    name: upgrade (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.batch-base && 300 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Validate immutable candidate
        env:
          CANDIDATE_REF: ${{ inputs.candidate-ref || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate-ref || github.sha }}
          persist-credentials: false
      - name: Verify checked-out candidate
        env:
          CANDIDATE_REF: ${{ inputs.candidate-ref || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_REF"
      - uses: ./.github/actions/setup
        with:
          publish-caches: 'false'
          targets: '["host-launch-integration"]'
      # Prepare the previous release before any check runs, so every check, and
      # every promotion replay of one, finds it whatever failed before.
      - name: Check out the previous known installed build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prior known serving build, not inferred Store-creation provenance.
          # Cache maintenance publishes its build under the same pinned SHA.
          ref: 0e4b2225d106dd63fa9c38801188facb5e9c6335
          path: .amp/previous-release
          persist-credentials: false
      - run: mv .amp/previous-release "$RUNNER_TEMP/previous-release"
      - name: Restore the pinned previous release's compilation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/previous-release/.zig-cache
            ${{ runner.temp }}/previous-release/zig-pkg
          key: rui-previous-release-${{ runner.os }}-${{ runner.arch }}-0.17.0-0e4b2225d106dd63fa9c38801188facb5e9c6335
      - name: Start detached, then install, save real work, reinstall and restart the same Store
        # Each check's only copy; steps.py records the failed ones for a promotion to replay.
        timeout-minutes: 45
        run: |
          set -euo pipefail
          uname -sm
          git rev-parse HEAD
          zig version
          python3 -B tests/ci/steps.py --output-root "$RUNNER_TEMP/rui-upgrade-data" \
            'startup=RUI_FAILURE_ARTIFACTS="$RUNNER_TEMP/rui-failure-artifacts" zig build host-launch-integration -j2 --summary all' \
            'current-upgrade=mkdir -p "$STEP_OUTPUT"; RUI_UPGRADE_FAILURES="$STEP_OUTPUT" python3 -B tests/integration/previous_release_upgrade.py . .' \
            'previous-upgrade=mkdir -p "$STEP_OUTPUT"; RUI_UPGRADE_FAILURES="$STEP_OUTPUT" python3 -B tests/integration/previous_release_upgrade.py "$RUNNER_TEMP/previous-release" .'
      - name: Retain bounded failed-fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/rui-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
      - name: Retain failed synthetic Stores and Host diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/rui-upgrade-data/**/store/**
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
      - name: Bisect the promotion batch with each failed step
        if: ${{ failure() && inputs.batch-base != '' }}
        timeout-minutes: 240
        env:
          BASE: ${{ inputs.batch-base }}
          HEAD_SHA: ${{ inputs.candidate-ref }}
        run: python3 -B tests/ci/promotion.py --base "$BASE" --head "$HEAD_SHA" --logs "$RUNNER_TEMP/promotion-bisect"
      - name: Retain the bisect's verdict and replay logs
        if: ${{ failure() && inputs.batch-base != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-bisect-upgrade-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-bisect
          retention-days: 14
          if-no-files-found: ignore
