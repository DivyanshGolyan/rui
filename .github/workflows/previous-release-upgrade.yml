name: Previous installed-release upgrade
# Strict landing paths: tests/ci/strict_paths.py owns this list.
on:
  pull_request:
    paths:
      - 'src/store*'
      - 'src/*schema*'
      - 'src/server*'
      - 'src/execution*'
      - 'src/*recovery*'
      - 'tests/integration/*recovery*'
      - 'tests/integration/bash*'
      - 'build.zig'
      - 'build.zig.zon'
      - 'install.sh'
  push:
    branches: ['wip/land-*', 'main']
    paths:
      - 'src/store*'
      - 'src/*schema*'
      - 'src/server*'
      - 'src/execution*'
      - 'src/*recovery*'
      - 'tests/integration/*recovery*'
      - 'tests/integration/bash*'
      - 'build.zig'
      - 'build.zig.zon'
      - 'install.sh'
  workflow_dispatch:

permissions:
  contents: read

# Restore shared compilation inputs without competing with the selected suites.
cache-mode: read

concurrency:
  group: previous-release-upgrade-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  # Every main push keeps its own post-push result for the stable ref.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  upgrade:
    if: ${{ !github.event.repository.private }}
    name: upgrade (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          targets: '["host-launch-integration"]'
      - name: Normal detached startup under the default soft limit
        env:
          RUI_FAILURE_ARTIFACTS: ${{ runner.temp }}/rui-failure-artifacts
        run: zig build host-launch-integration -j2 --summary all
      - name: Read the pinned previous release
        id: previous
        # Prior known serving build, not inferred Store-creation provenance.
        # Cache maintenance publishes its build under the same pin.
        run: |
          sha=$(cat .github/previous-release)
          [[ $sha =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out the previous known installed build
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.previous.outputs.sha }}
          path: .amp/previous-release
          persist-credentials: false
      - run: mv .amp/previous-release "$RUNNER_TEMP/previous-release"
      - name: Restore the pinned previous release's compilation
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/previous-release/.zig-cache
            ${{ runner.temp }}/previous-release/zig-pkg
          key: rui-previous-release-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ steps.previous.outputs.sha }}
      - name: Install, save real work, reinstall and restart the same Store
        run: |
          set -euo pipefail
          uname -sm
          git rev-parse HEAD
          zig version
          mkdir -p "$RUI_UPGRADE_FAILURES"
          python3 -B tests/integration/previous_release_upgrade.py . .
          python3 -B tests/integration/previous_release_upgrade.py "$RUNNER_TEMP/previous-release" .
        env:
          RUI_UPGRADE_FAILURES: ${{ runner.temp }}/rui-upgrade-data
      - name: Retain bounded failed-fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/rui-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
      - name: Retain failed synthetic Stores and Host diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/rui-upgrade-data/**/store/**
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
