name: Previous installed-release upgrade
# Strict PR paths; every main-tip stable candidate runs by explicit dispatch.
on:
  pull_request:
    paths:
      - 'src/store*'
      - 'src/*schema*'
      - 'src/server*'
      - 'src/execution*'
      - 'src/*recovery*'
      - 'tests/integration/*recovery*'
      - 'tests/integration/bash*'
      - 'build.zig'
      - 'build.zig.zon'
      - 'install.sh'
  workflow_dispatch:

permissions:
  contents: read

# Restore shared compilation inputs without competing with the selected suites.
cache-mode: read

concurrency:
  group: previous-release-upgrade-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  upgrade:
    if: ${{ !github.event.repository.private }}
    name: upgrade (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          targets: '["host-launch-integration"]'
      - name: Normal detached startup under the default soft limit
        env:
          RUI_FAILURE_ARTIFACTS: ${{ runner.temp }}/rui-failure-artifacts
        run: zig build host-launch-integration -j2 --summary all
      - name: Check out the previous known installed build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Prior known serving build, not inferred Store-creation provenance.
          # Cache maintenance publishes its build under the same pinned SHA.
          ref: 0e4b2225d106dd63fa9c38801188facb5e9c6335
          path: .amp/previous-release
          persist-credentials: false
      - run: mv .amp/previous-release "$RUNNER_TEMP/previous-release"
      - name: Restore the pinned previous release's compilation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/previous-release/.zig-cache
            ${{ runner.temp }}/previous-release/zig-pkg
          key: rui-previous-release-${{ runner.os }}-${{ runner.arch }}-0.17.0-0e4b2225d106dd63fa9c38801188facb5e9c6335
      - name: Install, save real work, reinstall and restart the same Store
        run: |
          set -euo pipefail
          uname -sm
          git rev-parse HEAD
          zig version
          mkdir -p "$RUI_UPGRADE_FAILURES"
          python3 -B tests/integration/previous_release_upgrade.py . .
          python3 -B tests/integration/previous_release_upgrade.py "$RUNNER_TEMP/previous-release" .
        env:
          RUI_UPGRADE_FAILURES: ${{ runner.temp }}/rui-upgrade-data
      - name: Retain bounded failed-fixture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/rui-failure-artifacts
          retention-days: 3
          if-no-files-found: ignore
      - name: Retain failed synthetic Stores and Host diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/rui-upgrade-data/**/store/**
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
  completion:
    needs: upgrade
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Wake Auto-land after this qualification finishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-land.yml --repo "$GITHUB_REPOSITORY" --ref main -f completed_run="$GITHUB_RUN_ID"
