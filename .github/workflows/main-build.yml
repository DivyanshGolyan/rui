name: Main build
# Compile main after every merge: each gate, every unit root, ReleaseSmall and
# the macOS type-check, through Selected checks' own producers, with no test
# run. PRs need no up-to-date base, so two green alone can break main together
# (#1410). A red build keeps one ci-red issue naming the PRs merged since the
# last green build; the next green build closes it. Never a required check.
on:
  push:
    branches: [main]
  # Rebuild main by hand.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # The newest main supersedes an older build.
  group: main-build
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    uses: ./.github/workflows/check.yml
    with:
      # Selection only names the push's range; a compile-only plan builds everything.
      base: ${{ github.event.before || 'HEAD^1' }}
      promotion: false
      compile_only: true
  report:
    needs: build
    # A superseded build says nothing about main.
    if: ${{ !cancelled() && contains(fromJSON('["success", "failure"]'), needs.build.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The crossing PRs are the first-parent range since the last green build.
          fetch-depth: 0
          persist-credentials: false
      - name: Open, update or close the one main-build issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 -B tests/ci/main_build.py --run-id "$GITHUB_RUN_ID" --sha "$HEAD_SHA" --result "$RESULT"
