name: Main build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-build
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    uses: ./.github/workflows/check.yml
    with:
      base: ${{ github.event.before || 'HEAD^1' }}
      promotion: false
      compile_only: true
  report:
    needs: build
    if: ${{ !cancelled() && contains(fromJSON('["success", "failure"]'), needs.build.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Open, update or close the one main-build issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 -B tests/ci/main_build.py --run-id "$GITHUB_RUN_ID" --sha "$HEAD_SHA" --result "$RESULT"
