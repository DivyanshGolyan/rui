name: Qualify main
# Every three hours, and by hand, run the full qualification tier
# (qualification-tier.yml, which Promote calls too) on main HEAD when HEAD has
# no main-qualified verdict yet. The batch runs from the last green qualified
# commit (else stable), so a failing step bisects to the commit that broke it
# and files one main-red issue per cause. The tier records its verdict and this
# run as the main-qualified status of HEAD; Promote publishes a green one's
# archives without qualifying again.
# It never publishes, merges or reverts.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One qualification at a time; a newer main waits for the current run.
  group: main-qualifier
  cancel-in-progress: false

jobs:
  batch:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      base: ${{ steps.batch.outputs.base }}
      head: ${{ steps.batch.outputs.head }}
      needed: ${{ steps.batch.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Name the batch since the last qualified commit
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          outputs=$(python3 -B tests/ci/main_qualified.py batch --head "$HEAD_SHA")
          echo "$outputs" >> "$GITHUB_OUTPUT"
          echo "$outputs"
      - name: Mark HEAD as qualifying
        if: ${{ steps.batch.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 -B tests/ci/main_qualified.py record --sha "$HEAD_SHA" --state pending --run-id "$GITHUB_RUN_ID"
  qualify:
    # The shared tier and its verdict (qualification-tier.yml). Without the
    # runner-status token its macOS jobs stay on hosted runners.
    needs: batch
    if: ${{ needs.batch.outputs.needed == 'true' }}
    permissions:
      # Only the release plan's draft lookup holds push access; it never writes.
      contents: write
      actions: read
      pull-requests: read
      checks: read
      statuses: write
      issues: write
    uses: ./.github/workflows/qualification-tier.yml
    with:
      base: ${{ needs.batch.outputs.base }}
      head: ${{ needs.batch.outputs.head }}
      red-label: main-red
