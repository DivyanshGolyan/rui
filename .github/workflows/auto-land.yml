name: Auto-land
# Promote exact qualified main SHAs to stable; changes reach main by merging their PRs.
# See tests/ci/auto_land.py.
on:
  workflow_run:
    workflows: [Selected checks, Previous installed-release upgrade]
    types: [completed]
    branches: [main]
  # A merged PR moves main; promotion dispatches its absent Mac and upgrade runs.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      completed_run:
        description: Main qualification run whose completion wakes promotion
        type: string
        required: true

permissions:
  contents: write
  actions: write
  # Promotion holds while a stable-red issue is open, after closing the issues
  # landed commits fix: GitHub ignores closing keywords in GITHUB_TOKEN pushes.
  issues: write

jobs:
  completion:
    # GITHUB_TOKEN-dispatched qualifications do not emit workflow_run callbacks.
    # Their final job explicitly dispatches us before its own workflow completes.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate parent provenance and await its complete result
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_RUN: ${{ inputs.completed_run }}
        run: |
          set -euo pipefail
          python3 -B tests/ci/auto_land.py --check-qualification-run "$COMPLETED_RUN"
          timeout --kill-after=5s 120s gh run watch "$COMPLETED_RUN" --exit-status --repo "$GITHUB_REPOSITORY"
  promote:
    needs: completion
    # Main pushes and main qualifications wake promotion; pull_request runs never do.
    if: ${{ always() && !github.event.repository.private && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.completion.result == 'success') || (github.event_name == 'workflow_run' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    concurrency:
      # Only the stable writer serializes. Waiting for a qualification never holds it.
      group: auto-land
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trusted main code decides.
          ref: main
          fetch-depth: 0
      - name: Promote the newest exact Mac-and-upgrade-green main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/auto_land.py --promote-stable
