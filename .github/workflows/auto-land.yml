name: Auto-land
# Land Linux-green tips on main; promote exact qualified main SHAs to stable separately.
# See tests/ci/auto_land.py.
on:
  workflow_run:
    workflows: [Selected checks, Previous installed-release upgrade]
    types: [completed]
    branches: ['wip/land-*', main]

permissions:
  contents: write
  actions: write

concurrency:
  # One landing decision at a time; a running push is never cancelled. A newer
  # queued run replaces a pending one, so each run decides every landing tip.
  group: auto-land
  cancel-in-progress: false

jobs:
  land:
    # Landing-tip pushes and dispatched qualifications wake the lander; pull_request runs never do.
    if: ${{ contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) && github.event.workflow_run.head_repository.full_name == github.repository && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Trusted main code decides; the tip is fetched as data and pushed, never run.
          ref: main
          fetch-depth: 0
      - name: Land green tips with non-force fast-forwards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/auto_land.py
      - name: Promote the newest exact Mac-and-upgrade-green main SHA
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/ci/auto_land.py --promote-stable
