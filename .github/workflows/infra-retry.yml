name: Retry infrastructure failures
# Rerun a PR's failed Selected checks jobs once when GitHub, a mirror or the
# runner failed and no check did: a 504 while fetching, a runner never acquired
# or lost. tests/ci/failure_cause.py decides; a test or build failure, a later
# attempt or a superseded head never reruns.
on:
  workflow_run:
    workflows: [Selected checks]
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    if: ${{ !github.event.repository.private && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run runs trusted main code; it never checks out the PR's head.
          ref: ${{ github.sha }}
          sparse-checkout: tests/ci
          persist-credentials: false
      - name: Rerun the failed jobs once if only infrastructure failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 -B tests/ci/failure_cause.py retry --run-id "$RUN_ID"
