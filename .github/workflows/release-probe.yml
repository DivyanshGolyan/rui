name: Release probe
# Temporary diagnostic (not for merge): which release-creation request the run token is refused.
on:
  pull_request:
    paths: ['.github/workflows/release-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Try each create shape, then delete what was made
        run: |
          set -u
          tag="v0.0.0-probe-${GITHUB_RUN_ID}"
          try() {
            echo "== $1"
            out=$(gh api -i --method POST "repos/$GITHUB_REPOSITORY/releases" --input - <<<"$2" 2>&1)
            echo "$out" | grep -iE '^HTTP/|x-accepted-github-permissions|x-github-request-id|"message"|"id":' | head -6
            id=$(echo "$out" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            if [ -n "$id" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id" && echo "deleted $id"; fi
          }
          try "draft, target e4bda700 (v0.94.0 sha), plain body" "{\"tag_name\":\"$tag-e\",\"target_commitish\":\"e4bda700764624e0ac4f635f2fbd8fb0faf5751f\",\"draft\":true,\"name\":\"probe\",\"body\":\"probe\"}"
          gh api "repos/$GITHUB_REPOSITORY/releases/457646706" --jq .body > body094.md
          try "draft, target main sha, v0.94.0 body" "$(jq -n --rawfile b body094.md --arg t "$tag-f" --arg c "$MAIN" '{tag_name:$t,target_commitish:$c,draft:true,name:"probe",body:$b}')"
          try "draft, target e4bda700, v0.94.0 body" "$(jq -n --rawfile b body094.md --arg t "$tag-g" '{tag_name:$t,target_commitish:"e4bda700764624e0ac4f635f2fbd8fb0faf5751f",draft:true,name:"probe",body:$b}')"
          try "draft, target main sha, body without memory table" "$(jq -n --rawfile b body094.md --arg t "$tag-h" --arg c "$MAIN" '{tag_name:$t,target_commitish:$c,draft:true,name:"probe",body:($b|split("### Host memory")[0])}')"
          echo "== list drafts (read)"; gh api "repos/$GITHUB_REPOSITORY/releases?per_page=3" --jq '.[].tag_name'
          git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" "v0.0.0-probe-*" || true
