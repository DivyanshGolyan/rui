name: Promote
# Runs every three hours at :45 UTC (15 past the hour IST) and by hand. Publish a qualified main commit and
# advance stable to it. On schedule the commit is main HEAD (inputs are empty,
# so `inputs.sha` is ''); when stable already holds it, the run does nothing.
# A HEAD with a red main-qualified record is skipped quietly, since the failing
# run already filed its issues. By hand, the commit is main HEAD by default;
# `sha` names an earlier first-parent main commit after stable, or `qualified`
# the newest one with a green main-qualified record. A commit that a scheduled
# or earlier promotion qualified green publishes that run's archives at once.
# Otherwise, only for main HEAD, Promote runs the same qualification tier
# (qualification-tier.yml) over the batch since stable, the last promoted
# release, and Release publishes the archives it built and tested. A failing
# job names its batch's suspects in its log (promotion.py suspects); the run never
# merges. A manual run with `bisect-step` replays one named step across
# `bisect-base`..`bisect-head` by binary search and promotes nothing. A red
# record refuses a manual promotion.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Main commit to publish (empty is main HEAD; `qualified` is the newest green one)
        type: string
        required: false
        default: ''
      bisect-step:
        description: Manual bisect, promotes nothing; the failed step's name, its space-separated targets (such as stack-frames)
        type: string
        required: false
        default: ''
      bisect-base:
        description: Manual bisect; the commit the bisected batch starts after (stable)
        type: string
        required: false
        default: ''
      bisect-head:
        description: Manual bisect; the last commit of the bisected batch
        type: string
        required: false
        default: ''
  schedule:
    - cron: '45 */3 * * *'

permissions:
  contents: read

# Restore shared compilation inputs without saving them: the manual bisect replays old commits.
cache-mode: read

concurrency:
  # One promotion at a time; a second dispatch waits for the first to finish.
  group: promote
  cancel-in-progress: false

jobs:
  batch:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private && inputs.bisect-step == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The release plan sees draft reservations only with push access; it never writes.
      contents: write
      actions: read
      statuses: read
    outputs:
      base: ${{ steps.batch.outputs.base }}
      head: ${{ steps.batch.outputs.head }}
      size: ${{ steps.batch.outputs.size }}
      reuse: ${{ steps.batch.outputs.reuse }}
      run: ${{ steps.batch.outputs.run }}
      version: ${{ steps.batch.outputs.version }}
      weekly: ${{ steps.weekly.outputs.weekly }}
      daily: ${{ steps.weekly.outputs.daily }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Choose the commit and name the batch since stable
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
          CHOSEN: ${{ inputs.sha }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          outputs=$(python3 -B tests/ci/main_qualified.py choose --main "$MAIN_SHA" --sha "$CHOSEN" $( [ "$SCHEDULED" = true ] && echo --scheduled ))
          echo "$outputs" >> "$GITHUB_OUTPUT"
          echo "$outputs"
      - name: Choose whether this run checks pins (weekly) or sweeps for races (daily)
        id: weekly
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          # Promote runs at :45 UTC every three hours; the 03:45 Monday run (09:15 IST) checks pins, allowing two hours of schedule delay.
          day_hour=$(date -u +%u%H)
          weekly=false
          if [ "$SCHEDULED" = true ] && [ "$day_hour" \> 102 ] && [ "$day_hour" \< 106 ]; then weekly=true; fi
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"
          echo "weekly dependency check: $weekly"
          # The 18:45 UTC run (00:15 IST) sweeps for races once a day, allowing two hours of schedule delay.
          hour=$(date -u +%H)
          daily=false
          if [ "$SCHEDULED" = true ] && [ "$hour" \> 17 ] && [ "$hour" \< 21 ]; then daily=true; fi
          echo "daily=$daily" >> "$GITHUB_OUTPUT"
          echo "daily race sweep: $daily"
  qualify:
    # The shared tier and its verdict (qualification-tier.yml), only when the
    # chosen commit is main HEAD without a green record to reuse.
    needs: batch
    if: ${{ needs.batch.outputs.size != '0' && needs.batch.outputs.reuse != 'true' }}
    permissions:
      # Only the release plan's draft lookup holds push access; it never writes.
      contents: write
      actions: read
      pull-requests: read
      checks: read
      statuses: write
      issues: write
    uses: ./.github/workflows/qualification-tier.yml
    with:
      base: ${{ needs.batch.outputs.base }}
      head: ${{ needs.batch.outputs.head }}
      # Scheduled runs file main-red, which the main-is-red timeline reads; manual promotions file promotion-red.
      red-label: ${{ github.event_name == 'schedule' && 'main-red' || 'promotion-red' }}
    # Only the runner-status token, so promotion's Mac routing can see rui-mac.
    secrets:
      MAC_RUNNER_STATUS_TOKEN: ${{ secrets.MAC_RUNNER_STATUS_TOKEN }}
  release:
    # Publication of the archives the qualifying run built and tested, here or
    # in the run that qualified the commit, and the stable fast-forward of the
    # qualified SHA. It rebuilds nothing. The commit is qualified when the
    # batch reused a green record or this run's tier recorded success.
    needs: [batch, qualify]
    # The repository variable SCHEDULED_RELEASES=paused holds scheduled publication;
    # scheduled runs still qualify and record, and a manual promotion publishes.
    if: ${{ !cancelled() && needs.batch.result == 'success' && needs.batch.outputs.size != '0' && (needs.batch.outputs.reuse == 'true' || needs.qualify.result == 'success') && !(github.event_name == 'schedule' && vars.SCHEDULED_RELEASES == 'paused') }}
    permissions:
      contents: write
      actions: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.batch.outputs.head }}
      version: ${{ needs.batch.outputs.reuse == 'true' && needs.batch.outputs.version || needs.qualify.outputs.version }}
      artifact-run: ${{ needs.batch.outputs.run }}
  dependency_lag:
    # Keeps the deps-behind issue current (#1893); a skipped job uses no runner.
    needs: batch
    if: ${{ needs.batch.outputs.weekly == 'true' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/dependency-lag.yml
  race_sweep:
    # Starts the daily race sweep as its own run, so its result, issues and duration
    # stay apart from Promote's; a skipped job uses no runner.
    needs: batch
    if: ${{ needs.batch.outputs.daily == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the race sweep on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run race-sweep.yml --repo "$GITHUB_REPOSITORY" --ref main
  bisect:
    # A manual replay of one failed step across a range of main commits. It qualifies,
    # records and publishes nothing, and the 90-minute replay cap is promotion.py's.
    if: ${{ inputs.bisect-step != '' && github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Require a range to bisect
        env:
          BASE: ${{ inputs.bisect-base }}
          HEAD_SHA: ${{ inputs.bisect-head }}
        run: test -n "$BASE" && test -n "$HEAD_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # Every target a failed step can name, so the replay's toolchain and fixtures are all present.
          targets: '["check-full","test-logic","admission-debug-integration","stack-frames","rsql-table"]'
          publish-caches: 'false'
      - name: Bisect the named step across the range
        env:
          STEP: ${{ inputs.bisect-step }}
          BASE: ${{ inputs.bisect-base }}
          HEAD_SHA: ${{ inputs.bisect-head }}
        run: python3 -B tests/ci/promotion.py bisect --base "$BASE" --head "$HEAD_SHA" --step "$STEP" --logs "$RUNNER_TEMP/promotion-bisect"
      - name: Retain the verdict and replay logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-bisect-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-bisect
          retention-days: 14
          if-no-files-found: ignore
