name: Promote
# Manual only. Publish a qualified main commit and advance stable to it.
# By default the commit is main HEAD; `sha` names an earlier first-parent main
# commit after stable, or `qualified` the newest one with a green
# main-qualified record. A commit Qualify main (main-qualifier.yml) or an
# earlier promotion qualified green publishes that run's archives at once.
# Otherwise, only for main HEAD, Promote runs the same qualification tier
# (qualification-tier.yml) over the batch since stable, the last promoted
# release, and Release publishes the archives it built and tested. A failing
# job bisects the batch with its own command; the run never merges. A red
# record refuses.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Main commit to publish (empty is main HEAD; `qualified` is the newest green one)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # One promotion at a time; a second dispatch waits for the first to finish.
  group: promote
  cancel-in-progress: false

jobs:
  batch:
    if: ${{ github.ref == 'refs/heads/main' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The release plan sees draft reservations only with push access; it never writes.
      contents: write
      actions: read
      statuses: read
    outputs:
      base: ${{ steps.batch.outputs.base }}
      head: ${{ steps.batch.outputs.head }}
      size: ${{ steps.batch.outputs.size }}
      reuse: ${{ steps.batch.outputs.reuse }}
      run: ${{ steps.batch.outputs.run }}
      version: ${{ steps.batch.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Choose the commit and name the batch since stable
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ github.sha }}
          CHOSEN: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          outputs=$(python3 -B tests/ci/main_qualified.py choose --main "$MAIN_SHA" --sha "$CHOSEN")
          echo "$outputs" >> "$GITHUB_OUTPUT"
          echo "$outputs"
  qualify:
    # The shared tier and its verdict (qualification-tier.yml), only when the
    # chosen commit is main HEAD without a green record to reuse.
    needs: batch
    if: ${{ needs.batch.outputs.size != '0' && needs.batch.outputs.reuse != 'true' }}
    permissions:
      # Only the release plan's draft lookup holds push access; it never writes.
      contents: write
      actions: read
      pull-requests: read
      checks: read
      statuses: write
      issues: write
    uses: ./.github/workflows/qualification-tier.yml
    with:
      base: ${{ needs.batch.outputs.base }}
      head: ${{ needs.batch.outputs.head }}
      red-label: promotion-red
    # Only the runner-status token, so promotion's Mac routing can see rui-mac.
    secrets:
      MAC_RUNNER_STATUS_TOKEN: ${{ secrets.MAC_RUNNER_STATUS_TOKEN }}
  release:
    # Publication of the archives the qualifying run built and tested, here or
    # in the run that qualified the commit, and the stable fast-forward of the
    # qualified SHA. It rebuilds nothing. The commit is qualified when the
    # batch reused a green record or this run's tier recorded success.
    needs: [batch, qualify]
    if: ${{ !cancelled() && needs.batch.result == 'success' && needs.batch.outputs.size != '0' && (needs.batch.outputs.reuse == 'true' || needs.qualify.result == 'success') }}
    permissions:
      contents: write
      actions: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ needs.batch.outputs.head }}
      version: ${{ needs.batch.outputs.reuse == 'true' && needs.batch.outputs.version || needs.qualify.outputs.version }}
      artifact-run: ${{ needs.batch.outputs.run }}
