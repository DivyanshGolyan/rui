name: Qualification tier
# The one owner of main's full qualification tier and its verdict. Promote
# (promote.yml, scheduled and by hand) is its one caller, for the batch
# BASE..HEAD of main: release archives built cold first, beside the Linux and
# macOS suites; the upgrade check and renderer contracts test those archives.
# It records the verdict as HEAD's main-qualified status with the caller's run,
# whose archives Promote publishes, files one issue per failure cause under
# the caller's label, and publishes nothing; publication stays with Promote.
# Its jobs appear as "<caller job> / <job>", and github.workflow is the
# caller's name, so concurrency groups and filed issues name the caller.
on:
  workflow_call:
    inputs:
      base:
        description: Commit the batch starts after; each failing step names its suspects in BASE..HEAD
        type: string
        required: true
      head:
        description: Main commit under qualification
        type: string
        required: true
      red-label:
        description: Label for the issue each failure cause files
        type: string
        required: true
    secrets:
      # Runner routing: only a caller that passes it may route macOS to rui-mac.
      MAC_RUNNER_STATUS_TOKEN:
        required: false
    outputs:
      version:
        description: Release version the archives were built for
        value: ${{ jobs.release_build.outputs.version }}

permissions:
  contents: read

jobs:
  release_build:
    # Version planning and cold release archives of HEAD. Publishes nothing.
    permissions:
      # The plan sees draft reservations only with push access; it never writes.
      contents: write
      actions: read
    uses: ./.github/workflows/release-build.yml
    with:
      sha: ${{ inputs.head }}
  selected:
    # Full check-full, frame gate and Debug recovery on Linux and macOS, plus
    # the targets the batch's paths select.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    uses: ./.github/workflows/check.yml
    with:
      base: ${{ inputs.base }}
      promotion: true
    # Only the runner-status token, so the caller's Mac routing can see rui-mac.
    secrets:
      MAC_RUNNER_STATUS_TOKEN: ${{ secrets.MAC_RUNNER_STATUS_TOKEN }}
  upgrade:
    # Tests the release executables; without a planned release it compiles the candidate.
    needs: release_build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/previous-release-upgrade.yml
    with:
      candidate-ref: ${{ inputs.head }}
      batch-base: ${{ inputs.base }}
      release-version: ${{ needs.release_build.outputs.version }}
  renderer:
    needs: release_build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/renderer-contracts.yml
    with:
      ref: ${{ inputs.head }}
      batch-base: ${{ inputs.base }}
      release-version: ${{ needs.release_build.outputs.version }}
  memory:
    # The per-agent Host memory budget, judged on the linux-x86_64 archive this
    # promotion publishes. Its table is the release notes' Host memory section, so
    # Release uploads nothing new and measures nothing. Never skipped and never on a PR:
    # qualified reads its result, and verdict() counts a skipped tier as unfinished.
    needs: release_build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      # Installs the fixture Python (h2) that host_memory.py imports, which the release job's venv used to supply.
      - uses: ./.github/actions/setup
        with:
          publish-caches: 'false'
          targets: '["host-memory"]'
      - name: Fetch the release executable this promotion publishes
        id: release
        if: ${{ needs.release_build.outputs.version != '' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_build.outputs.version }}
          SHA: ${{ inputs.head }}
        run: |
          set -euo pipefail
          # A standalone assignment, so a failed fetch fails this step instead of leaving rui empty.
          rui=$(python3 -B tests/ci/release_under_test.py "$VERSION" "$SHA" "$RUNNER_TEMP/release-under-test")
          echo "rui=$rui" >> "$GITHUB_OUTPUT"
      - name: Gate the per-agent Host memory budget and write its release table
        id: memory
        # Without a planned release this compiles ReleaseSafe rui, as the upgrade check does.
        env:
          RUI_UNDER_TEST: ${{ steps.release.outputs.rui }}
          RUI_HOST_MEMORY_NOTES: ${{ runner.temp }}/host-memory.md
        run: |
          set -euo pipefail
          python3 -B tests/ci/steps.py --output-root "$RUNNER_TEMP/memory" \
            'host-memory=zig build host-memory --summary all ${RUI_UNDER_TEST:+"-Drui-under-test=$RUI_UNDER_TEST"}'
      - name: Name the promotion suspects of each failed step
        if: ${{ failure() }}
        env:
          BASE: ${{ inputs.base }}
          HEAD_SHA: ${{ inputs.head }}
        run: python3 -B tests/ci/promotion.py suspects --base "$BASE" --head "$HEAD_SHA"
      - name: Retain the Host memory table
        # Written even when the gate fails, so the failing scenario and its runs are on record.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rui-host-memory
          path: ${{ runner.temp }}/host-memory.md
          retention-days: 7
          if-no-files-found: ignore
  qualified:
    # The sole verdict, recorded on HEAD whatever it is; a cancelled tier
    # records an unfinished verdict that the next run qualifies again.
    needs: [release_build, selected, upgrade, renderer, memory]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record the verdict on HEAD
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head }}
          VERSION: ${{ needs.release_build.outputs.version }}
          RESULTS: >-
            ${{ needs.release_build.result }} ${{ needs.selected.result }}
            ${{ needs.upgrade.result }} ${{ needs.renderer.result }} ${{ needs.memory.result }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # one word per tier result
          state=$(python3 -B tests/ci/main_qualified.py verdict $RESULTS | sed -n 's/^state=//p')
          python3 -B tests/ci/main_qualified.py record --sha "$HEAD_SHA" --state "$state" --run-id "$GITHUB_RUN_ID" --version "$VERSION"
          echo "$HEAD_SHA: main-qualified $state" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Require every selected qualification tier
        env:
          STATE: ${{ steps.verdict.outputs.state }}
        run: test "$STATE" = success
  report:
    # One issue per failure signature, with the failing step's suspects on it.
    needs: [selected, upgrade, renderer, memory]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: File each failure under its cause
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head }}
          WORKFLOW: ${{ github.workflow }}
          RED_LABEL: ${{ inputs.red-label }}
        run: python3 -B tests/ci/report_issue.py --workflow "$WORKFLOW" --run-id "$GITHUB_RUN_ID" --sha "$HEAD_SHA" --label "$RED_LABEL"
