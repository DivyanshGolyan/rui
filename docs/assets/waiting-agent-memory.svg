      <text x="810" y="329" fill="#7e22ce" stroke="none" font-size="17" font-weight="600">Codex app-server · 206.5 MB</text>
    </g>
    <g data-harness="fx" stroke="#9a3412">
      <polyline points="85.00,445.00 91.70,444.33 152.00,438.47 755.00,379.58" fill="none" stroke-width="2.5"/>
      <circle cx="85.00" cy="445.00" r="3.3" fill="#ffffff" stroke-width="2" data-agents="0" data-mb="0"/>
      <circle cx="91.70" cy="444.33" r="3.3" fill="#ffffff" stroke-width="2" data-agents="1" data-mb="1.3"/>
      <circle cx="152.00" cy="438.47" r="3.3" fill="#ffffff" stroke-width="2" data-agents="10" data-mb="12.7"/>
      <circle cx="755.00" cy="379.58" r="3.3" fill="#ffffff" stroke-width="2" data-agents="100" data-mb="127.2"/>
      <path d="M760 379.58 L800 365" fill="none" stroke-width="1.2"/>
      <text x="810" y="370" fill="#9a3412" stroke="none" font-size="17" font-weight="600">fx · 127.2 MB</text>
    </g>
    <g data-harness="pi" stroke="#1d4ed8">
      <polyline points="85.00,400.98 91.70,396.86 152.00,394.86 755.00,387.19" fill="none" stroke-width="2.5"/>
      <circle cx="85.00" cy="400.98" r="3.3" fill="#ffffff" stroke-width="2" data-agents="0" data-mb="85.6"/>
      <circle cx="91.70" cy="396.86" r="3.3" fill="#ffffff" stroke-width="2" data-agents="1" data-mb="93.6"/>
      <circle cx="152.00" cy="394.86" r="3.3" fill="#ffffff" stroke-width="2" data-agents="10" data-mb="97.5"/>
      <circle cx="755.00" cy="387.19" r="3.3" fill="#ffffff" stroke-width="2" data-agents="100" data-mb="112.4"/>
      <path d="M760 387.19 L800 402" fill="none" stroke-width="1.2"/>
      <text x="810" y="407" fill="#1d4ed8" stroke="none" font-size="17" font-weight="600">pi · 112.4 MB</text>
    </g>
    <g data-harness="Rui" stroke="#14532d">
      <polyline points="85.00,444.13 91.70,443.87 152.00,443.87 755.00,443.71" fill="none" stroke-width="2.5"/>
      <circle cx="85.00" cy="444.13" r="3.3" fill="#ffffff" stroke-width="2" data-agents="0" data-mb="1.7"/>
      <circle cx="91.70" cy="443.87" r="3.3" fill="#ffffff" stroke-width="2" data-agents="1" data-mb="2.2"/>
      <circle cx="152.00" cy="443.87" r="3.3" fill="#ffffff" stroke-width="2" data-agents="10" data-mb="2.2"/>
      <circle cx="755.00" cy="443.71" r="3.3" fill="#ffffff" stroke-width="2" data-agents="100" data-mb="2.5"/>
      <path d="M760 443.71 L800 442" fill="none" stroke-width="1.2"/>
      <text x="810" y="447" fill="#14532d" stroke="none" font-size="17" font-weight="600">Rui · 2.5 MB</text>
    </g>
    <text x="35" y="541" font-size="15" fill="#475569">Fake model accepts requests and never answers. Unequal tool sets. Not an active-workload memory budget.</text>
    <text x="35" y="565" font-size="14" fill="#475569">Source: divyanshgolyan.com/posts/hundred-agents/ · 30 October 2026 · Rui 5014980</text>
  </g>
</svg>
