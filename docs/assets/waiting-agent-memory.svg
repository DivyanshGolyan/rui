<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">Private memory as waiting-agent populations grow</title>
  <desc id="desc">Published Linux model-wait benchmark, median of three runs, measured on 30 October 2026. At 0, 1, 10, and 100 agents respectively, private memory in MB is Rui: 1.7, 2.2, 2.2, 2.5; pi: 85.6, 93.6, 97.5, 112.4; fx: 0, 1.3, 12.7, 127.2; Codex app-server: 14.7, 25.5, 49.6, 206.5; OpenCode: 174.2, 529.8, 556.7, 650.7. Both axes are linear. Lines connect measured points, not projections. This is private memory summed across harness processes, not RSS. A fake model never answers. Tool sets differ.</desc>
  <rect width="1100" height="580" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#172033">
    <text x="35" y="34" font-size="24" font-weight="700">Memory while agents wait for a model</text>
    <text x="35" y="61" font-size="16">Published Linux benchmark · private memory · median of 3 runs</text>
    <text x="85" y="85" dy="-8" font-size="14" fill="#475569">MB</text>
    <path d="M85 445.00 H755" stroke="#e2e8f0" fill="none"/>
    <text x="70" y="450.00" text-anchor="end" font-size="14" fill="#475569">0</text>
    <path d="M85 393.57 H755" stroke="#e2e8f0" fill="none"/>
    <text x="70" y="398.57" text-anchor="end" font-size="14" fill="#475569">100</text>
    <path d="M85 342.14 H755" stroke="#e2e8f0" fill="none"/>
    <text x="70" y="347.14" text-anchor="end" font-size="14" fill="#475569">200</text>
    <path d="M85 290.71 H755" stroke="#e2e8f0" fill="none"/>
    <text x="70" y="295.71" text-anchor="end" font-size="14" fill="#475569">300</text>
    <path d="M85 239.29 H755" stroke="#e2e8f0" fill="none"/>
    <text x="70" y="244.29" text-anchor="end" font-size="14" fill="#475569">400</text>
    <path d="M85 187.86 H755" stroke="#e2e8f0" fill="none"/>
    <text x="70" y="192.86" text-anchor="end" font-size="14" fill="#475569">500</text>
    <path d="M85 136.43 H755" stroke="#e2e8f0" fill="none"/>
    <text x="70" y="141.43" text-anchor="end" font-size="14" fill="#475569">600</text>
    <path d="M85 85.00 H755" stroke="#e2e8f0" fill="none"/>
    <text x="70" y="90.00" text-anchor="end" font-size="14" fill="#475569">700</text>
    <path d="M85 85 V445 H755" stroke="#64748b" fill="none"/>
    <path d="M85.00 445 v6" stroke="#64748b"/>
    <text x="85.00" y="470" text-anchor="middle" font-size="15">0</text>
    <path d="M152.00 445 v6" stroke="#64748b"/>
    <text x="152.00" y="470" text-anchor="middle" font-size="15">10</text>
    <path d="M420.00 445 v6" stroke="#64748b"/>
    <text x="420.00" y="470" text-anchor="middle" font-size="15">50</text>
    <path d="M755.00 445 v6" stroke="#64748b"/>
    <text x="755.00" y="470" text-anchor="middle" font-size="15">100</text>
    <text x="420" y="500" text-anchor="middle" font-size="16">Waiting agents · measured at 0, 1, 10, and 100</text>
    <g data-harness="OpenCode" stroke="#9f1239">
      <polyline points="85.00,355.41 91.70,172.53 152.00,158.70 755.00,110.35" fill="none" stroke-width="2.5"/>
      <circle cx="85.00" cy="355.41" r="3.3" fill="#ffffff" stroke-width="2" data-agents="0" data-mb="174.2"/>
      <circle cx="91.70" cy="172.53" r="3.3" fill="#ffffff" stroke-width="2" data-agents="1" data-mb="529.8"/>
      <circle cx="152.00" cy="158.70" r="3.3" fill="#ffffff" stroke-width="2" data-agents="10" data-mb="556.7"/>
      <circle cx="755.00" cy="110.35" r="3.3" fill="#ffffff" stroke-width="2" data-agents="100" data-mb="650.7"/>
      <path d="M760 110.35 L800 106" fill="none" stroke-width="1.2"/>
      <text x="810" y="111" fill="#9f1239" stroke="none" font-size="17" font-weight="600">OpenCode · 650.7 MB</text>
    </g>
    <g data-harness="Codex app-server" stroke="#7e22ce">
      <polyline points="85.00,437.44 91.70,431.89 152.00,419.49 755.00,338.80" fill="none" stroke-width="2.5"/>
      <circle cx="85.00" cy="437.44" r="3.3" fill="#ffffff" stroke-width="2" data-agents="0" data-mb="14.7"/>
      <circle cx="91.70" cy="431.89" r="3.3" fill="#ffffff" stroke-width="2" data-agents="1" data-mb="25.5"/>
      <circle cx="152.00" cy="419.49" r="3.3" fill="#ffffff" stroke-width="2" data-agents="10" data-mb="49.6"/>
